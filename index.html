      (CAT_WORDS[board][c.name] || []).forEach(function(k){ catWords.push(k); });
    });
    var bad = /(成分|用法|注意|生产|保质|批号|地址|电话|网址|官网|净含量|执行标准|许可证|合格|客服|微信|扫码|使用说明|过敏|避免|置于|儿童)/;
    var best = { score: 0, name: '' };
    lines.forEach(function(line){
      var flatLine = normText(line), s = 0;
      if (brandHit && flatLine.indexOf(normText(brandHit)) >= 0) s += 2;
      if (catWords.some(function(k){ return normText(k) && flatLine.indexOf(normText(k)) >= 0; })) s += 2;
      if (/[水乳霜精华液膏粉油露膜洗眼唇盘笔刷]/.test(line)) s += 1;
      if (line.length >= 5) s += 1;
      if (line.replace(/[^A-Za-z\u4e00-\u9fa5]/g, '').length < 2) s -= 6;
      if (/^[\d\sA-Za-z.\-/]+$/.test(line)) s -= 4;
      if (bad.test(line)) s -= 4;
      if (s > best.score){ best = { score: s, name: line }; }
    });
    if (best.score < 3) return '';
    var name = best.name;
    if (brandHit){
      name = name.replace(new RegExp(escapeReg(brandHit), 'ig'), ' ');
    }
    name = name.replace(/\d+(?:\.\d+)?\s*(ml|mL|g|克)/ig, ' ')
      .replace(/净含量|规格|产品名称|品名/g, ' ')
      .replace(/([\u4e00-\u9fa5])\s+(?=[\u4e00-\u9fa5])/g, '$1')
      .replace(/^[\s\-*/·:：=%|]+|[\s\-*/·:：=%|]+$/g, '')
      .replace(/\s{2,}/g, ' ');
    return name.length >= 2 ? name.slice(0, 30) : '';
  }

  function parseSpec(text){
    var t = String(text || '').replace(/\s+/g, ' ');
    var re = /(\d{1,4}(?:\.\d+)?)\s*(ml|mL|ML|m1|mI|g|G|克|片|支|枚)/g;
    var m;
    while ((m = re.exec(t))){
      var n = Number(m[1]);
      if (!(n > 0 && n <= 2000)) continue;
      var u = m[2].toLowerCase();
      u = (u === 'ml' || u === 'm1' || u === 'mi') ? 'ml' : (u === 'g' || u === '克') ? 'g' : (u === '片' ? '片' : '支');
      return { size: n, unit: u };
    }
    return { size: '', unit: 'ml' };
  }

  function parseShade(text){
    var m1 = String(text || '').match(/(?:色号|颜色|shade|color)\s*[:：]?\s*([A-Za-z0-9][A-Za-z0-9\-.]{0,11})/i);
    if (m1) return m1[1].trim();
    var m2 = String(text || '').match(/\b(\d{1,2}[A-Z]{1,2})\b/);
    if (m2) return m2[1];
    return '';
  }

  function validISO(y, mo, da){
    var ys = Number(y), ms = Number(mo), ds = Number(da);
    if (ys < 2000 || ys > 2100 || ms < 1 || ms > 12 || ds < 1 || ds > 31) return '';
    var d = new Date(ys, ms - 1, ds);
    if (d.getFullYear() !== ys || d.getMonth() !== ms - 1 || d.getDate() !== ds) return '';
    return ys + '-' + pad(ms) + '-' + pad(ds);
  }

  function parseExpiry(text){
    var src = String(text || '');
    var found = [];
    var m, reA = /(20\d{2})\s*[年.\-/]\s*(\d{1,2})\s*[月.\-/]\s*(\d{1,2})\s*日?/g;
    while ((m = reA.exec(src))){ var d = validISO(m[1], m[2], m[3]); if (d) found.push({ d: d, before: src.slice(Math.max(0, m.index - 18), m.index) }); }
    var reB = /(20\d{2})(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])/g;
    while ((m = reB.exec(src))){ var d2 = validISO(m[1], m[2], m[3]); if (d2) found.push({ d: d2, before: '' }); }
    if (!found.length) return '';
    var expiry = '';
    found.forEach(function(x){
      if (/生产|制造|MFG|PD/i.test(x.before)) return;
      if (/到期|保质|有效|限期|EXP/i.test(x.before) && !expiry) expiry = x.d;
    });
    if (expiry) return expiry;
    var future = found.map(function(x){ return x.d; })
      .filter(function(d){ return daysFromToday(d) >= 0; }).sort();
    return future.length ? future[future.length - 1] : '';
  }

  function parseType(text){
    if (/小样|试用装|体验装|旅行装|sample/i.test(text)) return '小样';
    if (/中样|deluxe/i.test(text)) return '中样';
    return '正装';
  }

  function parseOcrText(text, hintBoard){
    var raw = String(text || '').replace(/\r/g, '');
    var boardHint = hintBoard === 'makeup' ? 'makeup' : 'skin';
    var brands = brandCandidates(raw);
    var catRes = categoryCandidates(raw);
    var skinScore = catRes.skin.reduce(function(s, c){ return s + c.score; }, 0);
    var makeupScore = catRes.makeup.reduce(function(s, c){ return s + c.score; }, 0);
    var board = boardHint;
    if (makeupScore > skinScore + 12) board = 'makeup';
    else if (skinScore > makeupScore + 12) board = 'skin';

    var cats = catRes[board];
    var bestBrand = brands[0] && brands[0].score >= 58 ? brands[0] : null;
    var bestCat = cats[0] && cats[0].score >= 55 ? cats[0] : null;
    var category = bestCat ? bestCat.name : state.categories[board][0].name;
    if (!state.categories[board].some(function(c){ return c.name === category; })) category = state.categories[board][0].name;

    var spec = parseSpec(raw);
    var fields = {
      board: board,
      brand: bestBrand ? bestBrand.name : '',
      name: extractProductName(raw, bestBrand ? bestBrand.hit : '', board, cats),
      category: category,
      size: spec.size,
      unit: spec.unit,
      type: parseType(raw),
      shade: board === 'makeup' ? parseShade(raw) : '',
      expiryDate: parseExpiry(raw),
      openMonths: catMonths(board, category)
    };
    return {
      fields: fields, brandCandidates: brands, catCandidates: cats,
      text: raw, source: '本地 OCR', confidence: 0, warn: ''
    };
  }

  function mergePrefill(boardHint, prefill){
    var board = prefill && prefill.board === 'makeup' ? 'makeup' : (prefill && prefill.board === 'skin' ? 'skin' : boardHint);
    var data = defaultRecord(board);
    if (!prefill) return data;
    var cat = prefill.category;
    if (!state.categories[board].some(function(c){ return c.name === cat; })) cat = state.categories[board][0].name;
    data.board = board;
    data.brand = prefill.brand || '';
    data.name = prefill.name || '';
    data.category = cat;
    data.size = (prefill.size === '' || prefill.size == null) ? '' : Number(prefill.size);
    data.unit = UNITS.indexOf(prefill.unit) >= 0 ? prefill.unit : 'ml';
    data.type = TYPE_LIST.indexOf(prefill.type) >= 0 ? prefill.type : '正装';
    data.shade = board === 'makeup' ? (prefill.shade || '') : '';
    data.expiryDate = prefill.expiryDate || '';
    data.openMonths = catMonths(board, cat);
    return data;
  }

  function ocrPanelHTML(ocr){
    if (!ocr) return '';
    if (ocr.warn){
      return '<div class="ocr-panel"><div class="ocr-head"><b>拍照入库</b><span class="tag">未识别</span></div>' +
        '<div class="cand">' + esc(ocr.warn) + '</div></div>';
    }
    var bc = (ocr.brandCandidates && ocr.brandCandidates.length)
      ? ocr.brandCandidates.map(function(c){ return c.name + ' ' + c.score + '%（匹配「' + c.hit + '」）'; }).join(' · ')
      : '未识别到品牌，请手动填写';
    var cc = (ocr.catCandidates && ocr.catCandidates.length)
      ? ocr.catCandidates.slice(0, 3).map(function(c){ return c.name + ' ' + c.score + '%（关键词「' + c.hits.join('、') + '」）'; }).join(' · ')
      : '未识别到品类，已使用当前板块默认品类';
    var conf = ocr.confidence ? ('文字识别置信度约 ' + ocr.confidence + '%。') : '';
    return '<div class="ocr-panel"><div class="ocr-head"><b>拍照识别结果</b><span class="tag">' + esc(ocr.source || '本地 OCR') + '</span></div>' +
      '<div class="cand"><b>品牌候选：</b>' + esc(bc) + '</div>' +
      '<div class="cand"><b>品类候选：</b>' + esc(cc) + '</div>' +
      '<div class="cand">' + esc(conf) + '识别结果仅供参考，请核对后再保存；识别不到的内容已留空。</div>' +
      (ocr.text ? '<details><summary>查看识别原文（最多 500 字）</summary><pre>' + esc(ocr.text.slice(0, 500)) + '</pre></details>' : '') +
      '</div>';
  }

  /* ---------- 9.3b 记录照片管理：多图、主图、排序、替换、编辑 ---------- */
  function bytesText(n){
    n = Number(n) || 0;
    if (!n) return '—';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function photoItemSize(it){
    if (it.added && it.full) return bytesText((it.thumb || '').length + it.full.length);
    var m = imgCache.meta[it.id];
    return m ? bytesText(m.bytes) : '—';
  }
  function draftItem(key){
    return photoDraft ? photoDraft.items.filter(function(it){ return it.id === key; })[0] : null;
  }

  function photoGalleryHTML(){
    var d = photoDraft || { items: [], cover: '' };
    var n = d.items.length;
    var cards = d.items.map(function(it, i){
      var isCover = it.id === d.cover;
      var thumb = it.thumb || imgThumb(it.id);
      return '<div class="pg-item' + (isCover ? ' is-cover' : '') + '">' +
        (thumb
          ? '<button type="button" class="pg-thumb" data-act="pview" data-key="' + esc(it.id) + '"><img src="' + thumb + '" alt="照片 ' + (i + 1) + '"></button>'
          : '<div class="pg-thumb missing">图片缺失</div>') +
        (isCover ? '<span class="pg-main">主图</span>' : '') +
        '<span class="pg-size">' + (it.added ? '待保存 · ' : '') + '约 ' + photoItemSize(it) + '</span>' +
        '<div class="pg-ops">' +
          (isCover ? '' : '<button type="button" class="btn mini ghost" data-act="pcover" data-key="' + esc(it.id) + '">设主图</button>') +
          '<button type="button" class="btn mini ghost" data-act="pup" data-key="' + esc(it.id) + '"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
          '<button type="button" class="btn mini ghost" data-act="pdown" data-key="' + esc(it.id) + '"' + (i === n - 1 ? ' disabled' : '') + '>↓</button>' +
          '<button type="button" class="btn mini ghost" data-act="pedit" data-key="' + esc(it.id) + '">编辑</button>' +
          '<button type="button" class="btn mini ghost" data-act="preplace" data-key="' + esc(it.id) + '">替换</button>' +
          '<button type="button" class="btn mini danger" data-act="pdel" data-key="' + esc(it.id) + '">' + (pendingDelKey === it.id ? '确认删除' : '删除') + '</button>' +
        '</div></div>';
    }).join('');

    var add = n < 9
      ? '<div class="pg-add"><span>＋ 添加照片</span><small>还可添加 ' + (9 - n) + ' 张；长边约 1600px，自动压缩</small>' +
        '<div class="pg-add-btns"><button type="button" class="btn mini" data-act="paddcam">拍照</button>' +
        '<button type="button" class="btn mini" data-act="paddalbum">相册 / 文件</button></div></div>'
      : '';

    return '<div class="photo-gallery" id="photoGallery">' +
      '<div class="pg-head"><b>产品照片</b><span class="hint">' + n + ' / 9 · 主图显示在列表卡片</span></div>' +
      (n ? '<div class="pg-grid">' + cards + '</div>' : '<p class="hint">还没有照片。可以拍照、从相册选图，或把图片拖进表单。</p>') +
      add +
      '<p class="gallery-note">照片保存在本机 IndexedDB，不上传；删除照片可释放空间。编辑 / 裁剪后点「保存记录」才写回，取消不会改动原图。</p>' +
      '<input type="file" id="formPhotoCamera" accept="image/*" capture="environment" hidden>' +
      '<input type="file" id="formPhotoAlbum" accept="image/*" multiple hidden>' +
      '<input type="file" id="formPhotoReplace" accept="image/*" hidden>' +
      '</div>';
  }

  function renderPhotoGallery(){
    var host = document.getElementById('photoGallery');
    if (!host) return;
    host.outerHTML = photoGalleryHTML();
  }

  function moveDraftPhoto(key, delta){
    if (!photoDraft) return;
    var i = photoDraft.items.findIndex(function(it){ return it.id === key; });
    var j = i + delta;
    if (i < 0 || j < 0 || j >= photoDraft.items.length) return;
    var tmp = photoDraft.items[i];
    photoDraft.items[i] = photoDraft.items[j];
    photoDraft.items[j] = tmp;
    renderPhotoGallery();
  }

  function askDeleteDraftPhoto(key){
    if (!photoDraft) return;
    if (pendingDelKey !== key){
      pendingDelKey = key;
      renderPhotoGallery();
      setTimeout(function(){
        if (pendingDelKey === key){
          pendingDelKey = '';
          renderPhotoGallery();
        }
      }, 3000);
      return;
    }
    pendingDelKey = '';
    photoDraft.items = photoDraft.items.filter(function(it){ return it.id !== key; });
    if (photoDraft.cover === key) photoDraft.cover = photoDraft.items[0] ? photoDraft.items[0].id : '';
    renderPhotoGallery();
    toast('已移除这张照片，保存记录后生效');
  }

  function addDraftFiles(files, replaceKey){
    if (!photoDraft || !files || !files.length) return;
    var list = Array.prototype.slice.call(files).filter(function(f){ return f && /^image\//.test(f.type); });
    if (!list.length){ toast('请选择图片文件'); return; }
    if (list.some(function(f){ return f.size > 40 * 1024 * 1024; })){ toast('单张图片不能超过 40MB'); return; }
    var target = replaceKey || '';
    if (target){
      if (!draftItem(target)){ toast('目标照片已不存在'); return; }
      list = list.slice(0, 1);
    } else {
      var slots = 9 - photoDraft.items.length;
      if (slots <= 0){ toast('最多 9 张照片，请先删除一些'); return; }
      if (list.length > slots){ list = list.slice(0, slots); toast('已按上限 9 张截取'); }
    }
    toast('正在压缩 ' + list.length + ' 张照片…');
    var i = 0;
    var next = function(){
      if (i >= list.length) return;
      var f = list[i++];
      decodeImage(f).then(function(img){
        var full = drawToDataURL(img, 1600, 0.85);
        var thumb = drawToDataURL(img, 300, 0.7);
        var item = { id: 'img-' + uid(), thumb: thumb, full: full, added: true };
        if (target){
          var pos = photoDraft.items.findIndex(function(it){ return it.id === target; });
          if (pos < 0) return;
          var old = photoDraft.items[pos];
          photoDraft.items[pos] = item;
          if (photoDraft.cover === old.id) photoDraft.cover = item.id;
        } else {
          if (photoDraft.items.length >= 9) return;
          photoDraft.items.push(item);
          if (!photoDraft.cover) photoDraft.cover = item.id;
        }
        renderPhotoGallery();
      }).catch(function(e){
        console.warn('照片处理失败', e);
        toast('有一张图片处理失败：' + (e.message || '无法读取'));
      }).then(next);
    };
    next();
  }

  /* ---------- 9.3c 基础图片编辑（旋转 / 镜像 / 裁剪 / 亮度对比度） ---------- */
  var photoEdit = null;

  function openPhotoEditor(key){
    var item = draftItem(key);
    if (!item){ toast('照片不存在'); return; }
    var start = function(dataUrl){
      var img = new Image();
      img.onload = function(){ showPhotoEditor(img, item); };
      img.onerror = function(){ toast('无法加载原图'); };
      img.src = dataUrl;
    };
    if (item.full){ start(item.full); return; }
    toast('正在读取原图…');
    imgGetFull(key).then(function(d){
      if (d) start(d); else toast('原图不在本机图片库，无法编辑');
    }).catch(function(e){ console.warn(e); toast('读取原图失败'); });
  }

  function showPhotoEditor(img, item){
    closePhotoEditor();
    var host = document.createElement('div');
    host.id = 'photoEditor';
    host.innerHTML =
      '<div class="editor-backdrop" data-eclose="1"></div>' +
      '<div class="editor-wrap">' +
        '<div class="editor-head"><h3>编辑照片</h3><button type="button" class="icon-btn" data-eclose="1" aria-label="关闭">×</button></div>' +
        '<div class="editor-stage" id="edStage"><canvas id="edCanvas"></canvas>' +
          '<div class="crop-box" id="edCrop"><i data-handle="se"></i></div></div>' +
        '<div class="editor-tools">' +
          '<div class="tool-row"><button type="button" class="btn mini" data-eact="rotl">⟲ 左转 90°</button>' +
            '<button type="button" class="btn mini" data-eact="rotr">⟳ 右转 90°</button>' +
            '<button type="button" class="btn mini" data-eact="flip">⇋ 左右镜像</button></div>' +
          '<div class="tool-row">裁剪<button type="button" class="btn mini on" data-eact="cropfree">自由</button>' +
            '<button type="button" class="btn mini" data-eact="crop11">1:1</button>' +
            '<button type="button" class="btn mini ghost" data-eact="cropreset">重置裁剪</button></div>' +
          '<div class="tool-row">亮度<input type="range" id="edBright" min="50" max="150" value="100"><span class="tool-val" id="edBrightVal">100%</span></div>' +
          '<div class="tool-row">对比度<input type="range" id="edContrast" min="50" max="150" value="100"><span class="tool-val" id="edContrastVal">100%</span></div>' +
          '<div class="tool-row"><button type="button" class="btn mini ghost" data-eact="ereset">全部重置</button>' +
            '<span class="hint">拖动白框移动裁剪，拖右下角调整大小</span></div>' +
        '</div>' +
        '<div class="editor-foot"><button type="button" class="btn" data-eclose="1">取消</button>' +
          '<button type="button" class="btn primary" data-esave="1">应用并保存</button></div>' +
      '</div>';
    document.body.appendChild(host);
    photoEdit = { img: img, item: item, rot: 0, flip: false, crop: { x: 0, y: 0, w: 1, h: 1 }, bright: 100, contrast: 100, mode: 'free', drag: null };
    bindPhotoEditor(host);
    renderPhotoEditor();
    requestAnimationFrame(renderPhotoEditor);
  }

  function closePhotoEditor(){
    var host = document.getElementById('photoEditor');
    if (host) host.remove();
    photoEdit = null;
  }

  function editorMetrics(){
    var w = photoEdit.img.naturalWidth || photoEdit.img.width;
    var h = photoEdit.img.naturalHeight || photoEdit.img.height;
    return photoEdit.rot % 180 ? { w: h, h: w } : { w: w, h: h };
  }

  function renderPhotoEditor(){
    var host = document.getElementById('photoEditor');
    if (!host || !photoEdit) return;
    var stage = host.querySelector('#edStage');
    var canvas = host.querySelector('#edCanvas');
    var m = editorMetrics();
    var maxW = Math.max(160, Math.min(stage.clientWidth || 600, 680));
    var maxH = Math.max(160, Math.min(stage.clientHeight || 420, 460));
    var scale = Math.min(maxW / m.w, maxH / m.h);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    canvas.width = Math.max(1, Math.round(m.w * scale));
    canvas.height = Math.max(1, Math.round(m.h * scale));
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var iw = photoEdit.img.naturalWidth || photoEdit.img.width;
    var ih = photoEdit.img.naturalHeight || photoEdit.img.height;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(photoEdit.rot * Math.PI / 180);
    if (photoEdit.flip) ctx.scale(-1, 1);
    ctx.filter = 'brightness(' + photoEdit.bright + '%) contrast(' + photoEdit.contrast + '%)';
    ctx.drawImage(photoEdit.img, -iw * scale / 2, -ih * scale / 2, iw * scale, ih * scale);
    ctx.restore();
    positionEditorCrop();
  }

  function positionEditorCrop(){
    var host = document.getElementById('photoEditor');
    if (!host || !photoEdit) return;
    var canvas = host.querySelector('#edCanvas');
    var stage = host.querySelector('#edStage');
    var box = host.querySelector('#edCrop');
    var cr = canvas.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    if (!cr.width) return;
    var c = photoEdit.crop;
    box.style.left = (cr.left - sr.left + c.x * cr.width) + 'px';
    box.style.top = (cr.top - sr.top + c.y * cr.height) + 'px';
    box.style.width = Math.max(18, c.w * cr.width) + 'px';
    box.style.height = Math.max(18, c.h * cr.height) + 'px';
  }

  function setEditorMode(mode){
    if (!photoEdit) return;
    photoEdit.mode = mode;
    var host = document.getElementById('photoEditor');
    host.querySelectorAll('[data-eact="cropfree"], [data-eact="crop11"]').forEach(function(btn){
      var isSquare = btn.getAttribute('data-eact') === 'crop11';
      btn.classList.toggle('on', isSquare === (mode === 'square'));
    });
    if (mode === 'square'){
      var m = editorMetrics();
      var ratio = m.w / m.h;
      var maxS = Math.min(1 - photoEdit.crop.x, (1 - photoEdit.crop.y) / ratio, 1);
      var s = Math.max(0.12, Math.min(photoEdit.crop.w, photoEdit.crop.h / ratio, maxS));
      photoEdit.crop.w = s;
      photoEdit.crop.h = s * ratio;
    }
    renderPhotoEditor();
  }

  function bindPhotoEditor(host){
    host.addEventListener('click', function(ev){
      if (ev.target.closest('[data-eclose]')){ closePhotoEditor(); return; }
      if (ev.target.closest('[data-esave]')){ savePhotoEditor(); return; }
      var actEl = ev.target.closest('[data-eact]');
      if (!actEl || !photoEdit) return;
      var act = actEl.getAttribute('data-eact');
      if (act === 'rotl'){ photoEdit.rot = (photoEdit.rot + 270) % 360; photoEdit.crop = { x: 0, y: 0, w: 1, h: 1 }; renderPhotoEditor(); }
      else if (act === 'rotr'){ photoEdit.rot = (photoEdit.rot + 90) % 360; photoEdit.crop = { x: 0, y: 0, w: 1, h: 1 }; renderPhotoEditor(); }
      else if (act === 'flip'){
        photoEdit.flip = !photoEdit.flip;
        var c = photoEdit.crop;
        photoEdit.crop = { x: Math.max(0, 1 - c.x - c.w), y: c.y, w: c.w, h: c.h };
        renderPhotoEditor();
      }
      else if (act === 'cropfree'){ setEditorMode('free'); }
      else if (act === 'crop11'){ setEditorMode('square'); }
      else if (act === 'cropreset'){ photoEdit.crop = { x: 0, y: 0, w: 1, h: 1 }; renderPhotoEditor(); }
      else if (act === 'ereset'){
        photoEdit.rot = 0; photoEdit.flip = false;
        photoEdit.crop = { x: 0, y: 0, w: 1, h: 1 };
        photoEdit.bright = 100; photoEdit.contrast = 100;
        host.querySelector('#edBright').value = 100;
        host.querySelector('#edContrast').value = 100;
        document.getElementById('edBrightVal').textContent = '100%';
        document.getElementById('edContrastVal').textContent = '100%';
        setEditorMode('free');
      }
    });
    host.querySelector('#edBright').addEventListener('input', function(){
      if (!photoEdit) return;
      photoEdit.bright = Number(this.value);
      document.getElementById('edBrightVal').textContent = this.value + '%';
      renderPhotoEditor();
    });
    host.querySelector('#edContrast').addEventListener('input', function(){
      if (!photoEdit) return;
      photoEdit.contrast = Number(this.value);
      document.getElementById('edContrastVal').textContent = this.value + '%';
      renderPhotoEditor();
    });

    var box = host.querySelector('#edCrop');
    box.addEventListener('pointerdown', function(ev){
      if (!photoEdit) return;
      ev.preventDefault();
      var handle = ev.target.getAttribute && ev.target.getAttribute('data-handle');
      photoEdit.drag = { mode: handle ? 'resize' : 'move', sx: ev.clientX, sy: ev.clientY, crop: { x: photoEdit.crop.x, y: photoEdit.crop.y, w: photoEdit.crop.w, h: photoEdit.crop.h } };
      try { box.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    box.addEventListener('pointermove', function(ev){
      if (!photoEdit || !photoEdit.drag) return;
      var d = photoEdit.drag;
      var canvas = host.querySelector('#edCanvas');
      var rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      var dx = (ev.clientX - d.sx) / rect.width;
      var dy = (ev.clientY - d.sy) / rect.height;
      var c = { x: d.crop.x, y: d.crop.y, w: d.crop.w, h: d.crop.h };
      if (d.mode === 'move'){
        c.x = Math.min(1 - c.w, Math.max(0, d.crop.x + dx));
        c.y = Math.min(1 - c.h, Math.max(0, d.crop.y + dy));
      } else {
        c.w = Math.min(1 - c.x, Math.max(0.12, d.crop.w + dx));
        c.h = Math.min(1 - c.y, Math.max(0.12, d.crop.h + dy));
        if (photoEdit.mode === 'square'){
          var ratio = rect.width / rect.height;
          c.h = Math.min(1 - c.y, c.w * ratio);
          c.w = Math.min(1 - c.x, c.h / ratio);
        }
      }
      photoEdit.crop = c;
      positionEditorCrop();
    });
    var endDrag = function(){ if (photoEdit) photoEdit.drag = null; };
    box.addEventListener('pointerup', endDrag);
    box.addEventListener('pointercancel', endDrag);
  }

  function savePhotoEditor(){
    if (!photoEdit) return;
    var m = editorMetrics();
    var img = photoEdit.img;
    var rotC = document.createElement('canvas');
    rotC.width = m.w; rotC.height = m.h;
    var rctx = rotC.getContext('2d');
    var iw = img.naturalWidth || img.width;
    var ih = img.naturalHeight || img.height;
    rctx.save();
    rctx.translate(m.w / 2, m.h / 2);
    rctx.rotate(photoEdit.rot * Math.PI / 180);
    if (photoEdit.flip) rctx.scale(-1, 1);
    rctx.drawImage(img, -iw / 2, -ih / 2, iw, ih);
    rctx.restore();

    var c = photoEdit.crop;
    var sx = Math.max(0, Math.round(c.x * m.w));
    var sy = Math.max(0, Math.round(c.y * m.h));
    var sw = Math.min(m.w - sx, Math.round(c.w * m.w));
    var sh = Math.min(m.h - sy, Math.round(c.h * m.h));
    if (sw < 2 || sh < 2){ toast('裁剪区域太小，请调整后再保存'); return; }

    var outScale = Math.min(1, 1600 / Math.max(sw, sh));
    var out = document.createElement('canvas');
    out.width = Math.max(1, Math.round(sw * outScale));
    out.height = Math.max(1, Math.round(sh * outScale));
    var octx = out.getContext('2d');
    octx.fillStyle = '#ffffff';
    octx.fillRect(0, 0, out.width, out.height);
    octx.filter = 'brightness(' + photoEdit.bright + '%) contrast(' + photoEdit.contrast + '%)';
    octx.drawImage(rotC, sx, sy, sw, sh, 0, 0, out.width, out.height);

    var full = out.toDataURL('image/jpeg', 0.85);
    var thumb = drawToDataURL(out, 300, 0.7);

    var item = photoEdit.item;
    var oldId = item.id;
    item.id = 'img-' + uid();
    item.thumb = thumb;
    item.full = full;
    item.added = true;
    if (photoDraft.cover === oldId) photoDraft.cover = item.id;
    closePhotoEditor();
    renderPhotoGallery();
    toast('照片已更新，保存记录后生效');
  }

  /* ---------- 9.4 在线 AI 通道（可选） ---------- */
  var AI_PROMPT = '请识别这张化妆品包装照片，只输出严格 JSON，不要任何解释。字段：' +
    '{"board":"skin或makeup","brand":"品牌名，看不到就留空","name":"产品名称","category":"品类",' +
    '"size":数字或null,"unit":"ml或g或支或片","shade":"色号","type":"正装或中样或小样",' +
    '"expiryDate":"YYYY-MM-DD或空","confidence":0到1}。' +
    '品类参考：护肤=洁面/卸妆/化妆水/爽肤水/乳液/面霜/精华/眼霜/面膜/防晒/身体护理/其他；' +
    '彩妆=底妆/唇妆/眼妆/腮红修容/美妆工具/其他。不要猜测看不清的内容。';

  function aiRecognize(dataUrl){
    var ai = state.settings.ai || {};
    var body = {
      model: ai.model || 'gpt-4o-mini',
      temperature: 0,
      max_tokens: 400,
      messages: [
        { role: 'system', content: '你是化妆品包装信息提取助手，只输出 JSON。' },
        { role: 'user', content: [
          { type: 'text', text: AI_PROMPT },
          { type: 'image_url', image_url: { url: dataUrl, detail: 'high' } }
        ] }
      ]
    };
    return fetch(ai.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ai.key },
      body: JSON.stringify(body)
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(json){
      var msg = json && json.choices && json.choices[0] && json.choices[0].message;
      var content = msg && msg.content;
      var text = '';
      if (typeof content === 'string') text = content;
      else if (Array.isArray(content)) text = content.map(function(p){ return (p && p.text) || ''; }).join('');
      var m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('返回内容不是 JSON');
      return { obj: JSON.parse(m[0]), text: text };
    });
  }

  function aiToPrefill(obj, rawText){
    var board = obj.board === 'makeup' ? 'makeup' : 'skin';
    var readText = [obj.brand, obj.name, obj.category, obj.shade, rawText].join('\n');
    var catRes = categoryCandidates(readText);
    var cats = catRes[board];
    var category = cats[0] && cats[0].score >= 55 ? cats[0].name : '';
    var exact = state.categories[board].filter(function(c){ return String(obj.category || '').indexOf(c.name) >= 0; })[0];
    if (exact) category = exact.name;
    if (!category) category = state.categories[board][0].name;

    var p = parseOcrText(readText, board);
    p.fields.board = board;
    p.fields.category = category;
    p.fields.openMonths = catMonths(board, category);
    if (obj.brand) p.fields.brand = String(obj.brand).trim();
    if (obj.name) p.fields.name = String(obj.name).trim().slice(0, 40);
    if (obj.size && Number(obj.size) > 0){ p.fields.size = Number(obj.size); p.fields.unit = UNITS.indexOf(obj.unit) >= 0 ? obj.unit : 'ml'; }
    if (obj.shade && board === 'makeup') p.fields.shade = String(obj.shade).trim().slice(0, 20);
    if (TYPE_LIST.indexOf(obj.type) >= 0) p.fields.type = obj.type;
    var exp = String(obj.expiryDate || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(exp)) p.fields.expiryDate = exp;

    p.brandCandidates = p.fields.brand
      ? [{ name: p.fields.brand, score: Math.round((Number(obj.confidence) || 0.7) * 100), hit: 'AI 返回' }]
      : [];
    p.catCandidates = cats;
    p.source = '在线 AI';
    p.confidence = Math.round((Number(obj.confidence) || 0.7) * 100);
    p.text = rawText || '';
    return p;
  }

  /* ---------- 9.5 tesseract.js 本地 OCR（CDN 加载，离线降级） ---------- */
  var TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var tesseractPromise = null;
  var ocrWorker = null;

  function loadTesseract(){
    if (window.Tesseract) return Promise.resolve(window.Tesseract);
    if (tesseractPromise) return tesseractPromise;
    tesseractPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = TESSERACT_URL;
      s.async = true;
      var timer = setTimeout(function(){ reject(new Error('识别组件加载超时')); }, 30000);
      s.onload = function(){
        clearTimeout(timer);
        if (window.Tesseract) resolve(window.Tesseract);
        else reject(new Error('识别组件对象缺失'));
      };
      s.onerror = function(){ clearTimeout(timer); reject(new Error('识别组件网络加载失败')); };
      document.head.appendChild(s);
    }).catch(function(e){ tesseractPromise = null; throw e; });
    return tesseractPromise;
  }

  function localRecognize(dataUrl, onProgress){
    return loadTesseract().then(function(T){
      var ready;
      if (!ocrWorker){
        ready = T.createWorker('chi_sim+eng', 1, {
          workerBlobURL: true,
          logger: function(m){
            var p = m && typeof m.progress === 'number' ? m.progress : 0;
            if (m.status === 'loading language traineddata') onProgress('正在下载中英文识别数据（首次约 30MB）…', 60 * p);
            else if (m.status === 'initializing api') onProgress('正在初始化识别引擎…', 62);
            else if (m.status === 'recognizing text') onProgress('正在识别包装文字…', 64 + 36 * p);
          }
        }).then(function(w){ ocrWorker = w; return w; });
      } else {
        ready = Promise.resolve(ocrWorker);
      }
      return ready.then(function(w){
        onProgress('正在识别包装文字…', 64);
        return w.recognize(dataUrl);
      }).then(function(ret){
        return {
          text: String((ret && ret.data && ret.data.text) || '').replace(/\r/g, '').replace(/\n{3,}/g, '\n\n'),
          confidence: Math.round(Number(ret && ret.data && ret.data.confidence) || 0)
        };
      });
    });
  }

  function withTimeout(promise, ms, message){
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error(message)); }, ms);
      promise.then(function(v){ clearTimeout(timer); resolve(v); },
        function(e){ clearTimeout(timer); reject(e); });
    });
  }

  function degradePhoto(err){
    photoBusy = false;
    var offline = navigator.onLine === false;
    var reason = offline
      ? '离线状态，识别不可用。照片已压缩完成，可以带图手动填写，图片仍会存档到本机。'
      : '识别不可用（' + esc(String((err && err.message) || '未知原因')) + '）。照片已压缩完成，可以带图手动填写并保存。';

  function recognizePhoto(dataUrl, hint, job){
    return new Promise(function(resolve){
      var ai = state.settings.ai || {};
      var done = function(p){ resolve(p); };
      var toLocal = function(){
        if (job !== photoJob) return;
        if (navigator.onLine === false){ degradePhoto(null); resolve(null); return; }
        setOcrStatus('正在准备本地 OCR…', 12);
        withTimeout(localRecognize(dataUrl, function(msg, pct){
          if (job === photoJob) setOcrStatus(msg, pct);
        }), 150000, '识别超时，请重试或手动填写').then(function(res){
          if (job !== photoJob) return;
          var parsed = parseOcrText(res.text, hint);
          parsed.confidence = res.confidence;
          parsed.source = '本地 OCR';
          setOcrStatus('识别完成，正在整理结果…', 100);
          done(parsed);
        }).catch(function(e){
          if (job !== photoJob) return;
          degradePhoto(e);
          resolve(null);
        });
      };
      if (ai.endpoint && ai.key){
        setOcrStatus('正在调用在线 AI 识别…', 15);
        withTimeout(aiRecognize(dataUrl), 60000, '在线 AI 识别超时').then(function(r){
          if (job !== photoJob) return;
          var parsed = aiToPrefill(r.obj, r.text);
          setOcrStatus('在线识别完成，正在整理结果…', 100);
          done(parsed);
        }).catch(function(e){
          if (job !== photoJob) return;
          console.warn('在线 AI 识别失败，回退本地 OCR', e);
          setOcrStatus('在线识别失败，改用本地 OCR…', 12);
          toLocal();
        });
      } else {
        toLocal();
      }
    });
  }

  function runPhotoFlow(file, boardHint){
    if (!file) return;
    if (!/^image\//.test(file.type)){ toast('请选择图片文件'); return; }
    if (file.size > 40 * 1024 * 1024){ toast('图片超过 40MB，请重新拍摄或先压缩'); return; }
    photoHint = boardHint === 'makeup' ? 'makeup' : 'skin';
    var job = ++photoJob;
    photoBusy = true;
    var previewUrl = URL.createObjectURL(file);
    showPhotoProcessing();
    var pv = document.getElementById('photoPreview');
    if (pv) pv.src = previewUrl;
    setOcrStatus('正在读取并压缩图片…', 4);

    decodeImage(file).then(function(img){
      URL.revokeObjectURL(previewUrl);
      previewUrl = '';
      if (job !== photoJob) return null;
      var c = compressPhoto(img);
      pendingPhoto = { full: c.full, thumb: c.thumb };
      var view = document.getElementById('photoPreview');
      if (view) view.src = c.thumb;
      setOcrStatus('照片已在本地压缩（长边约 1200px）', 10);
      return recognizePhoto(c.full, photoHint, job);
    }).then(function(parsed){
      if (job !== photoJob || !parsed) return;
      photoBusy = false;
      var ocrInfo = {
        source: parsed.source,
        brandCandidates: parsed.brandCandidates,
        catCandidates: parsed.catCandidates,
        confidence: parsed.confidence,
        text: parsed.text,
        warn: parsed.warn || ''
      };
      openForm(null, parsed.fields.board || photoHint, {
        prefill: parsed.fields,
        photo: pendingPhoto,
        ocr: ocrInfo
      });
    }).catch(function(e){
      if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = ''; }
      console.warn('拍照识别失败', e);
      if (job !== photoJob) return;
      if (pendingPhoto) { photoBusy = false; degradePhoto(e); }
      else { photoBusy = false; closeModal(); toast('图片处理失败：' + (e.message || '无法读取')); }
    });
  }

      img.style.transform = 'translate(0,0) scale(1)';
      img.removeAttribute('src');
      viewerGetUrl(id).then(function(url){
        if (!viewerState || viewerState.ids[viewerState.idx] !== id) return;
        if (url) img.src = url;
        else toast('这张照片在本机图片库中不存在');
      }).catch(function(e){ console.warn(e); toast('读取图片失败'); });
    }
    var del = document.getElementById('vDel');
    if (del) del.textContent = '删除这张照片';
    var prev = document.querySelector('#photoViewer [data-vprev]');
    var next = document.querySelector('#photoViewer [data-vnext]');
    if (prev) prev.disabled = st.ids.length < 2;
    if (next) next.disabled = st.ids.length < 2;
    var strip = document.getElementById('vStrip');
    if (strip){
      strip.innerHTML = st.ids.map(function(pid, k){
        var th = (draftItem(pid) && draftItem(pid).thumb) || imgThumb(pid);
        return '<button type="button" data-vthumb="' + k + '" class="' + (k === st.idx ? 'on' : '') + '" aria-label="第 ' + (k + 1) + ' 张">' +
          (th ? '<img src="' + th + '" alt="">' : '<span style="display:block;width:46px;height:46px"></span>') + '</button>';
      }).join('');
    }
  }

  function applyViewerZoom(){
    var st = viewerState;
    if (!st) return;
    var img = document.getElementById('vImg');
    if (img) img.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) scale(' + st.scale + ')';
  }

  function viewerAskDelete(){
    var st = viewerState;
    if (!st) return;
    var btn = document.getElementById('vDel');
    if (!st.delPending){
      st.delPending = 1;
      if (btn) btn.textContent = '再点一次确认删除';
      setTimeout(function(){
        if (viewerState && viewerState.delPending && document.getElementById('vDel')){
          viewerState.delPending = 0;
          document.getElementById('vDel').textContent = '删除这张照片';
        }
      }, 3000);
      return;
    }
    var id = st.ids[st.idx];
    imgDelete(id).catch(function(){});
    delete imgCache.meta[id];
    if (st.rec){
      var rec = findRecord(st.rec.id);
      if (rec){
        rec.photos = (rec.photos || []).filter(function(x){ return x !== id; });
        if (rec.photos.indexOf(rec.cover) < 0) rec.cover = rec.photos[0] || '';
        rec.imgId = rec.cover;
        persist();
      }
      renderApp(true);
    } else if (photoDraft){
      photoDraft.items = photoDraft.items.filter(function(it){ return it.id !== id; });
      if (photoDraft.cover === id) photoDraft.cover = photoDraft.items[0] ? photoDraft.items[0].id : '';
      renderPhotoGallery();
    }
    st.ids.splice(st.idx, 1);
    st.delPending = 0;
    if (!st.ids.length){ closePhotoViewer(); toast('照片已删除'); return; }
    if (st.idx >= st.ids.length) st.idx = st.ids.length - 1;
    viewerShow(st.idx);
    toast('照片已删除');
  }

  function bindViewer(host){
    host.addEventListener('click', function(ev){
      if (ev.target.closest('[data-vclose]')){ closePhotoViewer(); return; }
      if (ev.target.closest('[data-vprev]')){ if (viewerState) viewerShow(viewerState.idx - 1); return; }
      if (ev.target.closest('[data-vnext]')){ if (viewerState) viewerShow(viewerState.idx + 1); return; }
      if (ev.target.closest('[data-vdel]')){ viewerAskDelete(); return; }
      var th = ev.target.closest('[data-vthumb]');
      if (th){ viewerShow(Number(th.getAttribute('data-vthumb'))); return; }
    });

    var stage = host.querySelector('#vStage');
    stage.addEventListener('wheel', function(ev){
      if (!viewerState) return;
      ev.preventDefault();
      var s = viewerState.scale * Math.exp(-ev.deltaY * 0.0015);
      viewerState.scale = Math.max(1, Math.min(4, s));
      if (viewerState.scale === 1){ viewerState.tx = 0; viewerState.ty = 0; }
      applyViewerZoom();
    }, { passive: false });

    var pts = {};
    var startDist = 0, startScale = 1, pan = null;
    stage.addEventListener('pointerdown', function(ev){
      if (!viewerState) return;
      pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
      var n = Object.keys(pts).length;
      if (n === 2){
        var ks = Object.keys(pts);
        var a = pts[ks[0]], b = pts[ks[1]];
        startDist = Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)) || 1;
        startScale = viewerState.scale;
      } else if (n === 1){
        pan = { x: ev.clientX, y: ev.clientY, tx: viewerState.tx, ty: viewerState.ty };
      }
      try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    stage.addEventListener('pointermove', function(ev){
      if (!viewerState || !pts[ev.pointerId]) return;
      pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
      var n = Object.keys(pts).length;
      if (n === 2 && startDist){
        var ks = Object.keys(pts);
        var a = pts[ks[0]], b = pts[ks[1]];
        var d = Math.sqrt(Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2)) || 1;
        viewerState.scale = Math.max(1, Math.min(4, startScale * d / startDist));
        if (viewerState.scale === 1){ viewerState.tx = 0; viewerState.ty = 0; }
        applyViewerZoom();
      } else if (n === 1 && pan && viewerState.scale > 1){
        viewerState.tx = pan.tx + (ev.clientX - pan.x);
        viewerState.ty = pan.ty + (ev.clientY - pan.y);
        applyViewerZoom();
      }
    });
    var up = function(ev){
      delete pts[ev.pointerId];
      if (!Object.keys(pts).length){ startDist = 0; pan = null; }
    };
    stage.addEventListener('pointerup', up);
    stage.addEventListener('pointercancel', up);
  }

  /* ---------- 9.7 导出 / 删除图片 ---------- */
  function exportJSONWithImages(){
    Promise.all([imgAllMeta(), imgAllFull()]).then(function(res){
      // 多图结构：records 内含 photos / cover，images 提供每张的 thumb 与 full
      var metas = res[0] || [], fulls = res[1] || [];
      var fullMap = {};
      fulls.forEach(function(f){ if (f && f.id) fullMap[f.id] = f.data; });
      var images = metas.filter(function(m){ return fullMap[m.id]; }).map(function(m){
        return { id: m.id, thumb: m.thumb, full: fullMap[m.id], createdAt: m.createdAt };
      });
      var payload = {
        app: 'skincare-inventory', version: 2,
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        records: state.records,
        images: images
      };
      var json = JSON.stringify(payload);
      var mb = json.length / (1024 * 1024);
      if (mb > 8 && !window.confirm('含图片备份约 ' + mb.toFixed(1) + ' MB，导出与导入都会较慢，确定继续？')) return;
      download(json, '护肤彩妆库存含图片-' + todayISO() + '.json', 'application/json');
      toast('已导出含 ' + images.length + ' 张图片的备份');
    }).catch(function(e){ console.warn(e); toast('读取图片失败，未导出'); });
  }

  /* =========================================================
     10. 交互事件
     ========================================================= */
  function findRecord(id){ return state.records.filter(function(r){ return r.id === id; })[0]; }

  function toggleGroup(board, key){
    var set = ui.collapsed[board];
    if (set.has(key)) set.delete(key); else set.add(key);
    renderBoardList();
  }

  function addCategory(board){
    var input = document.getElementById('newcat-' + board);
    var monthsInput = document.getElementById('newcat-' + board + '-months');
    var name = input.value.trim();
    var months = Number(monthsInput.value);
    if (!name){ toast('请填写品类名称'); input.focus(); return; }
    if (state.categories[board].some(function(c){ return c.name === name; })){
      toast('已存在同名品类'); return;
    }
    if (!(months >= 1 && months <= 120)){ toast('默认期限请填写 1 - 120 个月'); return; }
    state.categories[board].push({ name: name, months: Math.round(months) });
    persist();
    toast('已新增品类「' + name + '」');
    renderApp(true);
  }

  function moveCategory(board, index, delta){
    var arr = state.categories[board];
    var j = index + delta;
    if (j < 0 || j >= arr.length) return;
    var tmp = arr[index]; arr[index] = arr[j]; arr[j] = tmp;
    persist();
    renderApp(true);
  }

  var modalHost = document.getElementById('modalHost');
  function closeModal(){
    cancelPhoto();
    closePhotoEditor();
    closePhotoViewer();
    photoDraft = null;
    replaceTarget = '';
    pendingDelKey = '';
    modalHost.innerHTML = '';
  }
  function toast(msg){
    var el = document.getElementById('toast');
    if (!el){
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }
  function confirmDialog(text, onOk, okLabel){
    modalHost.innerHTML =
      '<div class="backdrop" data-close="1"></div>' +
      '<div class="dialog"><h3>请确认</h3><p>' + esc(text) + '</p>' +
        '<div class="drow"><button class="btn" data-close="1">取消</button>' +
        '<button class="btn danger" id="okBtn">' + esc(okLabel || '确认删除') + '</button></div></div>';
    document.getElementById('okBtn').onclick = function(){ closeModal(); onOk(); };
  }

  document.addEventListener('click', function(ev){
    var closeEl = ev.target.closest('[data-close]');
    if (closeEl){ closeModal(); return; }
    var el = ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var board = el.getAttribute('data-board');

    if (act === 'tab'){ switchTab(el.getAttribute('data-tab')); return; }
    if (act === 'add'){ openForm(null, board || (ui.tab === 'makeup' ? 'makeup' : 'skin')); return; }
    if (act === 'photo'){ openPhotoModal(board || (ui.tab === 'makeup' ? 'makeup' : 'skin')); return; }
    if (act === 'picCamera'){ var cam = document.getElementById('photoCamera'); if (cam) cam.click(); return; }
    if (act === 'picAlbum'){ var album = document.getElementById('photoAlbum'); if (album) album.click(); return; }
    if (act === 'picCancel'){ closeModal(); return; }
    if (act === 'picManual'){
      if (!pendingPhoto){ toast('照片已失效，请重新拍照'); return; }
      openForm(null, photoHint, {
        prefill: null, photo: pendingPhoto,
        ocr: { warn: '未进行文字识别，请手动填写；照片会随记录一起保存。' }
      });
      return;
    }
    if (act === 'viewimg'){
      var vr = findRecord(id);
      if (vr) openImageViewer(vr);
      return;
    }
    if (act === 'paddcam'){
      var fc = document.getElementById('formPhotoCamera');
      if (fc) fc.click();
      return;
    }
    if (act === 'paddalbum'){
      var fa = document.getElementById('formPhotoAlbum');
      if (fa) fa.click();
      return;
    }
    if (act === 'pview'){ openDraftViewer(el.getAttribute('data-key')); return; }
    if (act === 'pcover'){
      if (photoDraft){
        photoDraft.cover = el.getAttribute('data-key');
        renderPhotoGallery();
        toast('已设为主图');
      }
      return;
    }
    if (act === 'pup' || act === 'pdown'){
      moveDraftPhoto(el.getAttribute('data-key'), act === 'pup' ? -1 : 1);
      return;
    }
    if (act === 'pedit'){ openPhotoEditor(el.getAttribute('data-key')); return; }
    if (act === 'preplace'){
      replaceTarget = el.getAttribute('data-key');
      var fr = document.getElementById('formPhotoReplace');
      if (fr){ fr.value = ''; fr.click(); }
      return;
    }
    if (act === 'pdel'){ askDeleteDraftPhoto(el.getAttribute('data-key')); return; }
    if (act === 'delallimgs'){
      if (imgCache.error){ toast('图片库不可用'); return; }
      var stats = imgStatsText();
      confirmDialog('删除全部照片？' + stats + '记录字段会保留，此操作不可撤销。', function(){
        imgClearAll().catch(function(e){ console.warn(e); });
        state.records.forEach(function(r){ r.photos = []; r.cover = ''; r.imgId = ''; });
        if (photoDraft){ photoDraft.items = []; photoDraft.cover = ''; }
        imgCache.meta = {};
        persist();
        toast('全部照片已删除');
        renderApp(true);
      }, '删除全部');
      return;
    }
    if (act === 'saveai'){
      var endpoint = (document.getElementById('aiEndpoint').value || '').trim();
      var key = (document.getElementById('aiKey').value || '').trim();
      var model = (document.getElementById('aiModel').value || '').trim();
      if (!endpoint || !key){ toast('请填写接口地址和 API Key'); return; }
      if (!/^https?:\/\//i.test(endpoint)){ toast('接口地址需以 http:// 或 https:// 开头'); return; }
      state.settings.ai = { endpoint: endpoint, key: key, model: model || 'gpt-4o-mini' };
      persist();
      toast('AI 设置已保存（仅存本机）');
      renderApp(true);
      return;
    }
    if (act === 'clearai'){
      state.settings.ai = { endpoint: '', key: '', model: '' };
      persist();
      toast('已清除 AI 设置');
      renderApp(true);
      return;
    }
    if (act === 'exportjsonimg'){ exportJSONWithImages(); return; }
    if (act === 'edit'){
      var rec = findRecord(id);
      if (rec) openForm(rec);
      return;
    }
    if (act === 'del'){
      var target = findRecord(id);
      if (!target) return;
      confirmDialog('删除「' + target.brand + ' ' + target.name + '」这条记录？此操作不可撤销。', function(){
        (target.photos || []).forEach(function(pid){
          imgDelete(pid).catch(function(e){ console.warn(e); });
          delete imgCache.meta[pid];
        });
        state.records = state.records.filter(function(r){ return r.id !== id; });
        persist();
        toast('已删除');
        renderApp(true);
      });
      return;
    }
    if (act === 'finish'){
      var f = findRecord(id);
      if (f){ f.finished = true; f.snoozeUntil = ''; persist(); toast('已标记为用完'); renderApp(true); }
      return;
    }
    if (act === 'restore'){
      var rr = findRecord(id);
      if (rr){ rr.finished = false; persist(); toast('已恢复为在用'); renderApp(true); }
      return;
    }
    if (act === 'snooze'){
      var sr = findRecord(id);
      if (sr){ sr.snoozeUntil = addDays(todayISO(), 7); persist(); toast('7 天内不再提醒'); renderApp(true); }
      return;
    }
    if (act === 'dismissReminder'){
      state.settings.reminderDismissedOn = todayISO();
      persist();
      renderApp(true);
      return;
    }
    if (act === 'ics'){ exportICS(); return; }
    if (act === 'toggle'){ toggleGroup(board, el.getAttribute('data-key')); return; }
    if (act === 'view'){ ui.filters[board].view = el.getAttribute('data-view'); renderApp(true); return; }
    if (act === 'resetFilters'){
      ui.filters[board] = defFilter();
      renderApp(true);
      return;
    }
    if (act === 'exportjson'){ exportJSON(); return; }
    if (act === 'exportcsv'){ exportCSV(); return; }
    if (act === 'chooseimport'){
      var fi = document.getElementById('importFile');
      if (fi) fi.click();
      return;
    }
    if (act === 'clearsample'){
      var sampleCount = state.records.filter(function(r){ return r.sample; }).length;
      if (!sampleCount){ toast('没有示例数据'); return; }
      confirmDialog('清除 ' + sampleCount + ' 条示例记录？你自己新增的记录会保留。', function(){
        state.records = state.records.filter(function(r){ return !r.sample; });
        resetFiltersAll();
        persist();
        toast('示例数据已清除');
        renderApp(true);
      }, '确认清除');
      return;
    }
    if (act === 'reloadsample'){
      var sampleCount = sampleRecords().length;
      confirmDialog('追加 ' + sampleCount + ' 条示例记录到当前数据？', function(){
        var samples = sampleRecords();
        state.records = state.records.concat(samples);
        persist();
        toast('已载入示例数据');
        renderApp(true);
      }, '载入');
      return;
    }
    if (act === 'clearall'){
      confirmDialog('清空全部记录（包括示例和你新增的内容）？品类设置会保留，此操作不可撤销，关联照片也会一并删除。', function(){
        imgClearAll().catch(function(e){ console.warn(e); });
        imgCache.meta = {};
        state.records = [];
        resetFiltersAll();
        persist();
        toast('已清空全部记录');
        renderApp(true);
      }, '清空全部');
      return;
    }
    if (act === 'addcat'){ addCategory(board); return; }
    if (act === 'catup'){ moveCategory(board, Number(el.getAttribute('data-index')), -1); return; }
    if (act === 'catdown'){ moveCategory(board, Number(el.getAttribute('data-index')), 1); return; }
    if (act === 'catedit'){ openCatForm(board, Number(el.getAttribute('data-index'))); return; }
    if (act === 'catdel'){
      var idx = Number(el.getAttribute('data-index'));
      var cat = state.categories[board][idx];
      if (!cat) return;
      var used = state.records.filter(function(r){ return r.board === board && r.category === cat.name; }).length;
      if (used){ toast('该品类下还有 ' + used + ' 条记录，请先调整这些记录'); return; }
      confirmDialog('删除品类「' + cat.name + '」？', function(){
        state.categories[board].splice(idx, 1);
        if (ui.filters[board].cat === cat.name) ui.filters[board].cat = '';
        persist();
        toast('品类已删除');
        renderApp(true);
      });
      return;
    }
  });

  // 筛选：搜索与下拉
  document.addEventListener('input', function(ev){
    var board = ev.target.getAttribute && ev.target.getAttribute('data-board');
    var field = ev.target.getAttribute && ev.target.getAttribute('data-f');
    if (field === 'q' && board){
      ui.filters[board].q = ev.target.value;
      renderBoardList();
    }
  });
  document.addEventListener('change', function(ev){
    var board = ev.target.getAttribute && ev.target.getAttribute('data-board');
    var field = ev.target.getAttribute && ev.target.getAttribute('data-f');
    if (field && board && field !== 'q'){
      ui.filters[board][field] = ev.target.value;
      renderBoardList();
      return;
    }
    if (ev.target.id === 'importFile' && ev.target.files && ev.target.files[0]){
      importJSON(ev.target.files[0]);
      ev.target.value = '';
      return;
    }
    if ((ev.target.id === 'photoCamera' || ev.target.id === 'photoAlbum') && ev.target.files && ev.target.files[0]){
      var picked = ev.target.files[0];
      var bh = ev.target.getAttribute('data-board');
      ev.target.value = '';
      runPhotoFlow(picked, bh);
      return;
    }
    if (ev.target.id === 'formPhotoCamera' || ev.target.id === 'formPhotoAlbum'){
      var files = Array.prototype.slice.call(ev.target.files || []);
      ev.target.value = '';
      if (files.length) addDraftFiles(files);
      return;
    }
    if (ev.target.id === 'formPhotoReplace' && ev.target.files && ev.target.files[0]){
      var rf = ev.target.files[0];
      var rk = replaceTarget;
      ev.target.value = '';
      replaceTarget = '';
      addDraftFiles([rf], rk);
    }
  });

  // ESC 关闭弹层（编辑 > 查看器 > 表单）
  document.addEventListener('keydown', function(ev){
    if (ev.key !== 'Escape') return;
    if (photoEdit){ closePhotoEditor(); return; }
    if (viewerState){ closePhotoViewer(); return; }
    if (modalHost.innerHTML) closeModal();
  });

  function initDropZone(){
    var overlay = document.createElement('div');
    overlay.className = 'drop-overlay';
    overlay.innerHTML = '<div>松开即可拍照入库</div>';
    document.body.appendChild(overlay);
    var depth = 0;
    function hasFiles(e){
      var dt = e.dataTransfer;
      return !!(dt && dt.types && Array.prototype.indexOf.call(dt.types, 'Files') >= 0);
    }
    document.addEventListener('dragenter', function(e){
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth++;
      overlay.classList.add('show');
    });
    document.addEventListener('dragover', function(e){
      if (hasFiles(e)) e.preventDefault();
    });
    document.addEventListener('dragleave', function(e){
      if (!hasFiles(e)) return;
      depth = Math.max(0, depth - 1);
      if (!depth) overlay.classList.remove('show');
    });
    document.addEventListener('drop', function(e){
      if (!hasFiles(e)) return;
      e.preventDefault();
      depth = 0;
      overlay.classList.remove('show');
      var files = Array.prototype.slice.call(e.dataTransfer.files || []);
      if (!files.length) return;
      // 表单已打开时：拖入的照片直接加入当前记录，不再进入拍照识别流程
      if (photoDraft && document.getElementById('itemForm')){
        addDraftFiles(files);
        return;
      }
      var file = files[0];
      if (!/^image\//.test(file.type)){ toast('请拖入图片文件'); return; }
      if (ui.tab === 'data'){ toast('请先切换到概览或护肤 / 彩妆页面'); return; }
      runPhotoFlow(file, ui.tab === 'makeup' ? 'makeup' : 'skin');
    });
  }

  /* =========================================================
     11. 初始化
     ========================================================= */
  state = loadState();
  persist();
  renderApp(false);
  loadImgCache().then(function(){ renderApp(true); });
  initDropZone();
  window.addEventListener('offline', function(){
    toast('网络已断开：拍照识别将降级为手动填写，已有数据不受影响');
  });
  window.addEventListener('online', function(){
    toast('网络已恢复：本地 OCR 可继续使用');
  });
})();
