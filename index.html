<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>护肤品库存管理</title>
<style>
/* =========================================================
   基础变量：浅色 / 深色跟随系统
   ========================================================= */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --card:#ffffff;
  --surface-2:#f0f2f6;
  --border:#e1e6ee;
  --text:#151a21;
  --muted:#68727f;
  --accent:#6c4cf1;
  --accent-2:#9a7dff;
  --accent-soft:#eee9ff;
  --topbar:rgba(255,255,255,.84);
  --ok:#0b8f5a;
  --ok-bg:#e3f5ec;
  --near:#a86400;
  --near-bg:#fff1d6;
  --danger:#d43b3b;
  --danger-bg:#fdeaea;
  --done:#6f7a88;
  --done-bg:#eef1f4;
  --shadow:0 10px 30px rgba(20,30,50,.08);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1216;
    --surface:#171b21;
    --card:#1b2027;
    --surface-2:#222832;
    --border:#2c333d;
    --text:#eef1f5;
    --muted:#98a2b0;
    --accent:#a08bff;
    --accent-2:#8d76ff;
    --accent-soft:#2a2440;
    --topbar:rgba(15,18,22,.86);
    --ok:#4fd39c;
    --ok-bg:#12301f;
    --near:#f2b95e;
    --near-bg:#33270f;
    --danger:#ff7b7b;
    --danger-bg:#3a1d1d;
    --done:#98a2b0;
    --done-bg:#232a34;
    --shadow:0 12px 34px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650}
p{margin:0}

/* =========================================================
   布局与顶部导航
   ========================================================= */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1080px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.brandline{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.brandline h1{font-size:17px;letter-spacing:.2px}
.brandline p{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:8px 16px;border-radius:999px;font-size:13.5px;color:var(--muted);white-space:nowrap;transition:.15s}
.tabs button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 96px}

/* =========================================================
   通用组件
   ========================================================= */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.panel h2{font-size:17px}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 13px;border-radius:10px;font-size:13px;transition:.15s}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent}
.btn.mini{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger-bg)}
.icon-btn{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;border-radius:8px}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.badge{display:inline-block;font-size:11px;line-height:1.5;padding:2px 8px;border-radius:999px;font-weight:650;white-space:nowrap}
.badge.safe{background:var(--ok-bg);color:var(--ok)}
.badge.near{background:var(--near-bg);color:var(--near)}
.badge.expired{background:var(--danger-bg);color:var(--danger)}
.badge.finished{background:var(--done-bg);color:var(--done)}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);flex:none}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin:0 4px 4px 0}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}

/* =========================================================
   临期提醒卡片
   ========================================================= */
.reminder{margin:14px auto 0;max-width:1080px;padding:0 16px}
.reminder-card{border:1px solid var(--border);border-left:4px solid var(--near);background:linear-gradient(180deg,var(--near-bg),var(--surface));border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.reminder-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.reminder-head strong{font-size:14.5px}
.reminder-head span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.reminder-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:230px;overflow:auto}
.rrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.rrow .rmain{flex:1 1 150px;min-width:0}
.rrow b{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow small{font-size:11.5px;color:var(--muted)}
.rrow .ractions{display:flex;gap:6px;flex-wrap:wrap}
.reminder-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.reminder-foot span{font-size:11.5px;color:var(--muted)}

/* =========================================================
   概览
   ========================================================= */
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.stat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:900px){.stat-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px}
.stat .stat-label{font-size:11.5px;color:var(--muted);display:block}
.stat strong{display:block;font-size:25px;line-height:1.25;letter-spacing:-.5px}
.stat .stat-sub{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.stat.warn strong{color:var(--near)}
.stat.bad strong{color:var(--danger)}
.section{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.section-head h3{font-size:15px}
.two-col{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.two-col{grid-template-columns:1fr 1fr}}
.board-block{border:1px solid var(--border);border-radius:12px;padding:12px}
.board-block h4{font-size:13.5px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.board-block h4 span{font-size:11.5px;color:var(--muted);font-weight:400}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{font-size:12px;color:var(--muted);width:88px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .3s}
.bar-num{font-size:12px;width:28px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.brand-row{padding:9px 0;border-bottom:1px dashed var(--border)}
.brand-row:last-child{border-bottom:0}
.brand-line{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.brand-line b{font-size:13.5px}
.brand-line .bq{font-size:12px;color:var(--muted)}
.brand-cats{margin-top:6px}
.ov-list{display:flex;flex-direction:column;gap:7px}
.ov-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--border);background:var(--card);border-radius:9px;padding:8px 10px}
.ov-row:hover{background:var(--surface-2)}
.ov-row .oname{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-row .odate{font-size:11.5px;color:var(--muted);flex:none}

/* =========================================================
   板块列表 / 筛选
   ========================================================= */
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head p{font-size:12px;color:var(--muted);margin-top:2px}
.toolbar{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}
.search input{width:100%;padding:10px 12px;border-radius:11px}
.selects{display:flex;flex-wrap:wrap;gap:7px}
.selects select{width:auto;min-width:104px;flex:1 1 104px;padding:8px 10px;border-radius:9px;font-size:12.5px}
.view-toggle{display:flex;gap:6px;align-items:center}
.view-toggle button{border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;padding:6px 12px;border-radius:999px}
.view-toggle button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.group{border-bottom:1px solid var(--border)}
.group:last-child{border-bottom:0}
.group-head{display:flex;align-items:center;gap:9px;width:100%;padding:13px 4px;border:0;background:transparent;text-align:left}
.group-head:hover{background:var(--surface-2)}
.group-name{font-size:14px;font-weight:650;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.group-count{font-size:11.5px;color:var(--muted);flex:none}
.chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .18s;flex:none;margin-left:2px}
.chev.open{transform:rotate(45deg)}
.cards{display:grid;grid-template-columns:1fr;gap:9px;padding:2px 0 14px}
@media(min-width:680px){.cards{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}}
.item{display:flex;gap:10px;justify-content:space-between;border:1px solid var(--border);border-radius:13px;padding:11px 12px;background:var(--card);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.item.tone-near::before{background:var(--near)}
.item.tone-expired::before{background:var(--danger)}
.item-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.item-title{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-title .ibrand{color:var(--accent)}
.item-meta{font-size:11.5px;color:var(--muted)}
.item-date{font-size:11.5px;color:var(--text);opacity:.85}
.item-sub{font-size:11.5px;color:var(--muted)}
.item-note{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:4px 8px;margin-top:2px}
.item-side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.item-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.spec-chip{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:0 6px}

/* =========================================================
   数据管理 / 品类管理
   ========================================================= */
.block{margin-top:18px}
.block h3{font-size:15px;margin-bottom:4px}
.btn-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cat-group{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:10px}
.cat-group h4{font-size:13.5px;margin:0 0 8px}
.cat-row{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.cat-row:last-of-type{border-bottom:0}
.cat-row .cname{font-size:13px;flex:1 1 120px;min-width:0}
.cat-row .cmonth{font-size:11px;color:var(--muted);flex:none}
.cat-btns{display:flex;gap:4px}
.cat-btns button{border:1px solid var(--border);background:var(--surface);border-radius:7px;font-size:11.5px;padding:3px 7px;color:var(--muted)}
.cat-btns button:hover{background:var(--surface-2);color:var(--text)}
.cat-add{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.cat-add input{flex:1 1 120px}
.cat-add input[type=number]{flex:0 0 76px}
.cat-add button{flex:none}

/* =========================================================
   表单控件
   ========================================================= */
input,select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:9px 11px;font-size:14px;outline:none;transition:.15s;
  color-scheme:light dark;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.invalid,select.invalid{border-color:var(--danger);box-shadow:0 0 0 3px var(--danger-bg)}
textarea{resize:vertical;min-height:56px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.seg label{flex:1;text-align:center;font-size:13px;padding:7px 2px;border-radius:9px;color:var(--muted);cursor:pointer;user-select:none;transition:.15s}
.seg label.on{background:var(--surface);color:var(--text);font-weight:650;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.seg input{display:none}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;padding-top:4px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.preview{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:8px 10px}
.preview b{color:var(--text);font-weight:600}
.form-err{display:none;background:var(--danger-bg);color:var(--danger);border-radius:9px;padding:8px 10px;font-size:12.5px}
.form-err.show{display:block}
.form-err ul{margin:4px 0 0;padding-left:18px}

/* =========================================================
   弹层 / 侧滑表单 / 对话框
   ========================================================= */
.backdrop{position:fixed;inset:0;background:rgba(8,12,20,.48);z-index:30;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-wrap{position:fixed;inset:0;z-index:31;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet{pointer-events:auto;width:100%;background:var(--surface);border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slideUp .22s ease}
@keyframes slideUp{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:720px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{width:620px;max-height:86vh;border-radius:18px}
  .sheet.small{width:420px}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);flex:none}
.sheet-head h2{font-size:16px}
.sheet-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:10px;flex:none}
.sheet-foot .btn{flex:1;padding:11px}
.dialog{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 48px);max-width:400px;background:var(--surface);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.dialog h3{font-size:16px;margin-bottom:6px}
.dialog p{font-size:13px;color:var(--muted);line-height:1.6}
.dialog .drow{display:flex;gap:9px;margin-top:16px}
.dialog .drow .btn{flex:1}
.board-skin .makeup-only{display:none!important}

/* =========================================================
   浮动添加按钮 / Toast
   ========================================================= */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:15;border:0;border-radius:999px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;font-size:14px;font-weight:650;padding:13px 20px;box-shadow:0 10px 26px rgba(90,60,220,.35)}
.fab:active{transform:scale(.97)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:rgba(20,24,32,.92);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:999px;z-index:50;opacity:0;pointer-events:none;transition:.22s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* =========================================================
   拍照入库 / 图片存档
   ========================================================= */
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.item-photo{flex:none;position:relative;width:58px;height:58px;padding:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.item-photo img{width:100%;height:100%;object-fit:cover;display:block}
.item-photo .pcount{position:absolute;right:2px;bottom:2px;background:rgba(0,0,0,.66);color:#fff;font-size:10px;line-height:1.4;padding:0 5px;border-radius:6px}
.photo-gallery{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.pg-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:13px}
.pg-head b{font-size:13px}
.pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.pg-item{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px}
.pg-item.is-cover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.pg-thumb{padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--surface-2);width:100%;aspect-ratio:1/1}
.pg-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.pg-thumb.missing{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.pg-main{position:absolute;left:10px;top:10px;background:var(--accent);color:#fff;font-size:10px;line-height:1.5;padding:1px 6px;border-radius:6px}
.pg-size{font-size:10.5px;color:var(--muted)}
.pg-ops{display:flex;flex-wrap:wrap;gap:3px}
.pg-ops .btn{padding:2px 5px;font-size:10.5px;border-radius:6px}
.pg-add{border:1px dashed var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.pg-add span{font-size:12.5px;font-weight:600}
.pg-add small{font-size:11px;color:var(--muted)}
.pg-add-btns{display:flex;gap:6px}
.gallery-note{font-size:11px;color:var(--muted);line-height:1.6}
.photo-sheet{max-width:560px}
.photo-choices{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.photo-choices{grid-template-columns:1fr 1fr}}
.photo-choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1px solid var(--border);background:var(--surface-2);border-radius:13px;padding:14px}
.photo-choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.photo-choice .pico{font-size:19px;line-height:1.2;color:var(--accent)}
.photo-choice b{font-size:14px}
.photo-choice small{font-size:11.5px;color:var(--muted)}
.photo-preview{width:100%;max-height:220px;object-fit:contain;background:var(--surface-2);border-radius:12px;display:block}
.pbar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .25s}
.ocr-status{font-size:12.5px;color:var(--muted);min-height:18px}
.ocr-warn{background:var(--danger-bg);border-left:3px solid var(--danger);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.6}
.ocr-warn b{color:var(--danger);display:block;margin-bottom:3px}
.ocr-note{font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--surface-2);border-radius:9px;padding:8px 10px}
.ocr-panel{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.ocr-panel .ocr-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:650}
.ocr-panel .cand{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7}
.ocr-panel .cand b{color:var(--text);font-weight:600}
.ocr-panel details{margin-top:8px;font-size:11.5px;color:var(--muted)}
.ocr-panel pre{white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;margin:6px 0 0;font-size:11.5px;background:var(--surface);border-radius:8px;padding:8px}
.editor-backdrop{position:fixed;inset:0;background:rgba(8,12,20,.62);z-index:60}
.editor-wrap{position:fixed;z-index:61;inset:0;display:flex;flex-direction:column;background:var(--surface)}
@media(min-width:720px){
  .editor-wrap{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,94vw);max-height:92vh;border-radius:16px;box-shadow:var(--shadow)}
}
.editor-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
.editor-head h3{font-size:15px}
.editor-stage{position:relative;flex:1;min-height:220px;display:flex;align-items:center;justify-content:center;background:#0b0d10;overflow:hidden}
.editor-stage canvas{display:block;max-width:100%;max-height:100%}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);cursor:move;touch-action:none}
.crop-box i{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;background:#fff;border-radius:4px;cursor:nwse-resize}
.editor-tools{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;max-height:42vh;overflow:auto}
.tool-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tool-row .btn{padding:5px 9px;font-size:12px}
.tool-row .btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tool-row input[type=range]{flex:1;min-width:118px}
.tool-val{font-size:11px;color:var(--muted);width:34px;text-align:right}
.editor-foot{display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.editor-foot .btn{flex:1;padding:10px}
.drop-overlay{position:fixed;inset:0;z-index:45;display:none;place-items:center;background:rgba(108,76,241,.14);pointer-events:none}
.drop-overlay.show{display:grid}
.drop-overlay div{border:2px dashed var(--accent);background:var(--surface);border-radius:16px;padding:26px 34px;font-size:15px;font-weight:650;box-shadow:var(--shadow)}
.viewer-host{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;background:rgba(6,8,12,.95);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:#c9d0da;flex:none}
.vhead button{background:none;border:0;color:#fff;font-size:17px;padding:4px 8px}
.vstage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
.vstage img{max-width:94vw;max-height:74vh;object-fit:contain;will-change:transform}
.vnav{display:flex;align-items:center;justify-content:center;gap:14px;padding:6px 0;flex:none}
.vnav button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:19px}
.vnav button:disabled{opacity:.35}
.vnav span{font-size:12px;color:#c9d0da;min-width:52px;text-align:center}
.vstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;flex:none}
.vstrip button{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:none;flex:none}
.vstrip button.on{border-color:var(--accent-2)}
.vstrip img{width:46px;height:46px;object-fit:cover;display:block;opacity:.72}
.vfoot{display:flex;gap:8px;padding-top:8px;flex:none}
.vfoot .btn{flex:1;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff;padding:9px}
.vfoot .btn.danger{color:#ff9a9a;border-color:rgba(255,154,154,.5)}
.zoom-hint{font-size:10.5px;color:#8f98a5;text-align:center;padding-top:4px}
.ai-state{font-size:11.5px;color:var(--muted);align-self:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalHost"></div>
<script>
(function(){
  'use strict';

  /* =========================================================
     1. 常量与工具函数
     ========================================================= */
  var KEY = 'skincareInventoryV1';
  var DAY = 86400000;
  var TYPE_LIST = ['正装', '中样', '小样'];
  var UNITS = ['ml', 'g', '支', '片'];

  // 默认品类及开封后建议使用期限（月）
  var DEFAULT_CATS = {
    skin: [
      { name: '洁面', months: 12 },
      { name: '卸妆', months: 12 },
      { name: '化妆水/爽肤水', months: 12 },
      { name: '乳液', months: 12 },
      { name: '面霜', months: 12 },
      { name: '精华', months: 6 },
      { name: '眼霜', months: 6 },
      { name: '面膜', months: 12 },
      { name: '防晒', months: 6 },
      { name: '身体护理', months: 12 },
      { name: '其他', months: 12 }
    ],
    makeup: [
      { name: '底妆', months: 12 },
      { name: '唇妆', months: 18 },
      { name: '眼妆', months: 6 },
      { name: '腮红修容', months: 24 },
      { name: '美妆工具', months: 24 },
      { name: '其他', months: 12 }
    ]
  };
  var BOARD_LABEL = { skin: '护肤', makeup: '彩妆' };
  var STATUS_META = {
    safe: { label: '安全' },
    near: { label: '临近到期' },
    expired: { label: '已过期' },
    finished: { label: '已用完' }
  };

  function esc(v){
    return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid(){ return 'r-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }
  function qsum(list){ return list.reduce(function(s, r){ return s + (Number(r.qty) || 0); }, 0); }
  function cmpZh(a, b){ return String(a).localeCompare(String(b), 'zh-Hans-CN'); }
  function clampInt(v, min, max, fallback){
    var n = Math.round(Number(v));
    if (!isFinite(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  // 日期：统一使用本地日期字符串 YYYY-MM-DD
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO(){ return isoOf(new Date()); }
  function parseISO(s){
    var p = String(s || '').split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }
  function addDays(s, n){
    var d = parseISO(s); d.setDate(d.getDate() + n); return isoOf(d);
  }
  function addMonths(s, n){
    var d = parseISO(s), day = d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return isoOf(d);
  }
  function daysFromToday(s){
    var a = parseISO(todayISO()).getTime(), b = parseISO(s).getTime();
    return Math.round((b - a) / DAY);
  }

  /* =========================================================
     2. 状态与持久化
     ========================================================= */
  var state = null;
  var storageOK = true;
  var imgCache = { meta: {}, ready: false, error: null };
  var pendingPhoto = null; // 本次拍照流程中的压缩图（保存后才写入 IndexedDB）
  var photoDraft = null;   // 表单内的照片草稿 { items:[{id,thumb,full,added}], cover }
  var replaceTarget = '';  // 「替换」时目标照片的 id
  var pendingDelKey = '';  // 表单内删除照片的二次确认状态
  var ui = {
    tab: 'overview',
    filters: { skin: defFilter(), makeup: defFilter() },
    collapsed: { skin: new Set(), makeup: new Set() }
  };
  function defFilter(){
    return { q: '', brand: '', cat: '', type: '', status: '', sort: 'due', view: 'category' };
  }
  function resetFiltersAll(){
    ui.filters = { skin: defFilter(), makeup: defFilter() };
  }

  function catMonths(board, name){
    var arr = (state && state.categories[board]) || DEFAULT_CATS[board];
    for (var i = 0; i < arr.length; i++) if (arr[i].name === name) return arr[i].months;
    return 12;
  }

  function defaultRecord(board){
    var cats = state.categories[board];
    var first = cats[0] || { name: '其他', months: 12 };
    return {
      id: '', board: board, brand: '', name: '', category: first.name,
      size: '', unit: 'ml', type: '正装', qty: 1,
      opened: false, openDate: '', openMonths: first.months,
      expiryDate: '', prodDate: '', shelfMonths: '',
      location: '', note: '', shade: '', frequent: false,
      finished: false, snoozeUntil: '', sample: false,
      photos: [], cover: '', imgId: ''
    };
  }

  // 示例数据：覆盖护肤各功能品类 + 彩妆 5 个子类
  function sampleRecords(){
    var T = todayISO();
    function base(board){
      return {
        id: uid(), board: board, brand: '', name: '',
        category: board === 'skin' ? '洁面' : '底妆',
        size: '', unit: 'ml', type: '正装', qty: 1,
        opened: false, openDate: '', openMonths: 12,
        expiryDate: '', prodDate: '', shelfMonths: '',
        location: '', note: '', shade: '', frequent: false,
        finished: false, snoozeUntil: '', sample: true,
        photos: [], cover: '', imgId: ''
      };
    }
    function S(o){ return Object.assign(base('skin'), o); }
    function M(o){ return Object.assign(base('makeup'), o); }

    return [
      S({ brand: 'SK-II', name: '护肤洁面霜', category: '洁面', size: 120, unit: 'g', opened: true, openDate: addDays(T, -70), openMonths: 12, location: '浴室镜柜', note: '泡沫细腻，早晚使用' }),
      S({ brand: '贝德玛', name: '净妍洁肤液（蓝水）', category: '卸妆', size: 500, unit: 'ml', opened: true, openDate: addDays(T, -30), openMonths: 12, location: '浴室镜柜' }),
      S({ brand: '兰蔻', name: '清滢柔肤水（粉水）', category: '化妆水/爽肤水', size: 400, unit: 'ml', opened: true, openDate: addDays(T, -335), openMonths: 12, location: '梳妆台' }),
      S({ brand: '倩碧', name: '卓越润肤乳（黄油）', category: '乳液', size: 125, unit: 'ml', expiryDate: addDays(T, 200), location: '卧室抽屉' }),
      S({ brand: '雅诗兰黛', name: '特润修护肌活精华（小棕瓶）', category: '精华', size: 50, unit: 'ml', opened: true, openDate: addDays(T, -160), openMonths: 6, location: '梳妆台', note: '晚间使用' }),
      S({ brand: '修丽可', name: '植萃舒缓亮妍精华（色修）', category: '精华', size: 30, unit: 'ml', qty: 2, expiryDate: addDays(T, 240), location: '抽屉囤货' }),
      S({ brand: '资生堂', name: '悦薇智感紧塑眼霜', category: '眼霜', size: 15, unit: 'ml', opened: true, openDate: addDays(T, -190), openMonths: 6, location: '梳妆台' }),
      S({ brand: '海蓝之谜', name: '精华面霜', category: '面霜', size: 60, unit: 'ml', expiryDate: addDays(T, 75), location: '卧室抽屉' }),
      S({ brand: '科颜氏', name: '高保湿面霜', category: '面霜', size: 7, unit: 'ml', type: '小样', qty: 3, expiryDate: addDays(T, 18), location: '旅行包' }),
      S({ brand: '悦木之源', name: '泥娃娃活性炭面膜', category: '面膜', size: 100, unit: 'ml', prodDate: addDays(T, -700), shelfMonths: 36, location: '浴室' }),
      S({ brand: '安热沙', name: '金灿倍护防晒乳', category: '防晒', size: 60, unit: 'ml', opened: true, openDate: addDays(T, -200), openMonths: 6, location: '玄关', note: '去年夏天买的' }),
      S({ brand: '娇韵诗', name: '焕彩身体乳', category: '身体护理', size: 200, unit: 'ml', type: '中样', expiryDate: addDays(T, 300), location: '浴室' }),

      M({ brand: '雅诗兰黛', name: '持妆粉底液', category: '底妆', size: 30, unit: 'ml', shade: '1W1', frequent: true, opened: true, openDate: addDays(T, -340), openMonths: 12, location: '梳妆台' }),
      M({ brand: '花西子', name: '空气蜜粉', category: '底妆', size: 8, unit: 'g', shade: '03 自然色', expiryDate: addDays(T, 36), location: '化妆包' }),
      M({ brand: '阿玛尼', name: '红管唇釉', category: '唇妆', size: 6, unit: 'ml', shade: '405 豆沙红', frequent: true, opened: true, openDate: addDays(T, -300), openMonths: 18, location: '随身包' }),
      M({ brand: '香奈儿', name: '炫亮魅力睫毛膏', category: '眼妆', size: 6, unit: 'g', shade: '10 黑色', opened: true, openDate: addDays(T, -155), openMonths: 6, location: '化妆包', note: '开封后容易干' }),
      M({ brand: '完美日记', name: '探险家十二色眼影盘', category: '眼妆', size: 12, unit: 'g', shade: '斑虎盘', expiryDate: addDays(T, 500), location: '抽屉' }),
      M({ brand: 'NARS', name: '腮红（高潮）', category: '腮红修容', size: 8, unit: 'g', shade: 'Orgasm', frequent: true, opened: true, openDate: addDays(T, -400), openMonths: 24, location: '梳妆台' }),
      M({ brand: '植村秀', name: '55号粉底刷', category: '美妆工具', size: 1, unit: '支', opened: true, openDate: addDays(T, -400), openMonths: 24, location: '化妆包' })
    ];
  }

  function freshState(){
    return {
      version: 1,
      records: sampleRecords(),
      categories: {
        skin: DEFAULT_CATS.skin.map(function(c){ return { name: c.name, months: c.months }; }),
        makeup: DEFAULT_CATS.makeup.map(function(c){ return { name: c.name, months: c.months }; })
      },
      settings: { reminderDismissedOn: null, ai: { endpoint: '', key: '', model: '' } }
    };
  }

  function normalizeRecord(r, cats){
    r = r || {};
    var board = r.board === 'makeup' ? 'makeup' : 'skin';
    var fallbackCat = board === 'skin' ? '洁面' : '底妆';
    var category = String(r.category || fallbackCat);
    var list = cats[board] || [];
    var found = list.filter(function(c){ return c.name === category; })[0];

    // 多图与旧单图字段兼容：旧记录只有 imgId，归一到 photos + cover
    var photos = [];
    if (Array.isArray(r.photos)){
      r.photos.forEach(function(id){
        id = String(id || '');
        if (id && photos.indexOf(id) < 0) photos.push(id);
      });
    }
    photos = photos.slice(0, 9);
    var legacy = String(r.imgId || '');
    if (!photos.length && legacy) photos = [legacy];
    var cover = String(r.cover || '');
    if (photos.indexOf(cover) < 0) cover = legacy && photos.indexOf(legacy) >= 0 ? legacy : (photos[0] || '');

    return {
      id: r.id || uid(),
      board: board,
      brand: String(r.brand || '').trim(),
      name: String(r.name || '').trim(),
      category: category,
      size: (r.size === '' || r.size == null) ? '' : Number(r.size),
      unit: UNITS.indexOf(r.unit) >= 0 ? r.unit : 'ml',
      type: TYPE_LIST.indexOf(r.type) >= 0 ? r.type : '正装',
      qty: clampInt(r.qty, 1, 999, 1),
      opened: !!r.opened,
      openDate: r.openDate || '',
      openMonths: clampInt(r.openMonths, 1, 120, found ? found.months : 12),
      expiryDate: r.expiryDate || '',
      prodDate: r.prodDate || '',
      shelfMonths: r.shelfMonths === '' || r.shelfMonths == null ? '' : clampInt(r.shelfMonths, 1, 120, ''),
      location: String(r.location || ''),
      note: String(r.note || ''),
      shade: String(r.shade || ''),
      frequent: !!r.frequent,
      finished: !!r.finished,
      snoozeUntil: r.snoozeUntil || '',
      sample: !!r.sample,
      photos: photos,
      cover: cover,
      imgId: cover
    };
  }

  function normalizeState(s){
    var cats = {};
    ['skin', 'makeup'].forEach(function(b){
      var src = s.categories && s.categories[b];
      var arr = Array.isArray(src) ? src.filter(function(c){ return c && c.name; }).map(function(c){
        return { name: String(c.name), months: clampInt(c.months, 1, 120, 12) };
      }) : [];
      if (!arr.length) arr = DEFAULT_CATS[b].map(function(c){ return { name: c.name, months: c.months }; });
      cats[b] = arr;
    });
    var records = (Array.isArray(s.records) ? s.records : []).map(function(r){ return normalizeRecord(r, cats); });
    return {
      version: 1,
      records: records,
      categories: cats,
      settings: {
        reminderDismissedOn: (s.settings && s.settings.reminderDismissedOn) || null,
        ai: {
          endpoint: String((s.settings && s.settings.ai && s.settings.ai.endpoint) || ''),
          key: String((s.settings && s.settings.ai && s.settings.ai.key) || ''),
          model: String((s.settings && s.settings.ai && s.settings.ai.model) || '')
        }
      }
    };
  }

  function loadState(){
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
    if (raw){
      try {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.records)) return normalizeState(parsed);
      } catch (e) { console.warn('本地数据解析失败，使用示例数据', e); }
    }
    return freshState();
  }

  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e){
      console.warn('保存失败', e);
      if (storageOK){ storageOK = false; toast('本地保存失败：浏览器可能处于无痕模式或已禁用存储'); }
    }
  }

  /* =========================================================
     3. 到期与状态计算
     ========================================================= */
  function dueInfo(r){
    if (r.opened){
      if (!r.openDate) return { due: null, basis: '' };
      var om = Number(r.openMonths) || catMonths(r.board, r.category);
      return { due: addMonths(r.openDate, om), basis: '开封后' };
    }
    if (r.expiryDate) return { due: r.expiryDate, basis: '未开封' };
    if (r.prodDate && r.shelfMonths) return { due: addMonths(r.prodDate, Number(r.shelfMonths)), basis: '生产+保质期' };
    return { due: null, basis: '' };
  }

  function recordStatus(r){
    if (r.finished) return { key: 'finished', label: '已用完', days: null, due: null, basis: '' };
    var info = dueInfo(r);
    if (!info.due) return { key: 'safe', label: '安全', days: null, due: null, basis: '' };
    var d = daysFromToday(info.due);
    if (d < 0) return { key: 'expired', label: '已过期', days: d, due: info.due, basis: info.basis };
    if (d <= 30) return { key: 'near', label: '临近到期', days: d, due: info.due, basis: info.basis };
    return { key: 'safe', label: '安全', days: d, due: info.due, basis: info.basis };
  }

  function byDue(a, b){
    var da = dueInfo(a).due, db = dueInfo(b).due;
    if (!da && !db) return cmpZh(a.brand, b.brand);
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? -1 : da > db ? 1 : 0;
  }

  /* =========================================================
     4. 筛选 / 排序 / 分组
     ========================================================= */
  function sortRecords(list, mode){
    var arr = list.slice();
    if (mode === 'brand'){
      arr.sort(function(a, b){ return cmpZh(a.brand, b.brand) || cmpZh(a.name, b.name); });
    } else if (mode === 'qty'){
      arr.sort(function(a, b){ return (b.qty - a.qty) || cmpZh(a.brand, b.brand); });
    } else {
      arr.sort(byDue);
    }
    return arr;
  }

  function filteredRecords(board){
    var f = ui.filters[board];
    var q = f.q.trim().toLowerCase();
    var list = state.records.filter(function(r){ return r.board === board; });
    if (f.brand) list = list.filter(function(r){ return r.brand === f.brand; });
    if (f.cat) list = list.filter(function(r){ return r.category === f.cat; });
    if (f.type) list = list.filter(function(r){ return r.type === f.type; });
    if (f.status) list = list.filter(function(r){ return recordStatus(r).key === f.status; });
    if (q){
      list = list.filter(function(r){
        return [r.brand, r.name, r.category, r.note, r.location, r.shade, r.type].join(' ').toLowerCase().indexOf(q) >= 0;
      });
    }
    return sortRecords(list, f.sort);
  }

  // 当前板块的分组顺序
  function groupKeys(board, list){
    var f = ui.filters[board];
    var groups = {};
    if (f.view === 'brand'){
      list.forEach(function(r){
        var k = r.brand.trim() || '未填写品牌';
        (groups[k] = groups[k] || []).push(r);
      });
      return Object.keys(groups).sort(cmpZh);
    }
    list.forEach(function(r){
      (groups[r.category] = groups[r.category] || []).push(r);
    });
    var order = state.categories[board].map(function(c){ return c.name; });
    var keys = order.filter(function(k){ return groups[k]; });
    Object.keys(groups).forEach(function(k){ if (keys.indexOf(k) < 0) keys.push(k); });
    return keys;
  }

  /* =========================================================
     5. 渲染：提醒、顶部导航、板块
     ========================================================= */
  function reminderItems(){
    return state.records.filter(function(r){
      var st = recordStatus(r).key;
      if (st !== 'near' && st !== 'expired') return false;
      if (r.snoozeUntil && r.snoozeUntil > todayISO()) return false;
      return true;
    }).sort(byDue);
  }

  function bannerHTML(){
    if (state.settings.reminderDismissedOn === todayISO()) return '';
    var items = reminderItems();
    if (!items.length) return '';
    var nearN = items.filter(function(r){ return recordStatus(r).key === 'near'; }).length;
    var expN = items.length - nearN;
    var rows = items.map(function(r){
      var st = recordStatus(r);
      var due = dueInfo(r).due;
      var when = st.days != null ? (st.days < 0 ? '已超期 ' + (-st.days) + ' 天' : '剩 ' + st.days + ' 天') : '';
      return '<div class="rrow">' +
        '<span class="tag">' + BOARD_LABEL[r.board] + '</span>' +
        '<div class="rmain"><b>' + esc(r.brand) + ' ' + esc(r.name) + '</b>' +
          '<small>' + esc(due) + ' 到期 · ' + when + '</small></div>' +
        '<div class="ractions">' +
          '<button class="btn mini" data-act="finish" data-id="' + esc(r.id) + '">已用完</button>' +
          '<button class="btn mini ghost" data-act="snooze" data-id="' + esc(r.id) + '">稍后提醒(7天)</button>' +
        '</div></div>';
    }).join('');
    return '<div class="reminder"><div class="reminder-card">' +
      '<div class="reminder-head"><div><strong>到期提醒</strong>' +
        '<span>' + nearN + ' 项 30 天内临期 · ' + expN + ' 项已过期。这是页面内提醒，不是系统推送。</span></div>' +
        '<button class="icon-btn" data-act="dismissReminder" aria-label="关闭提醒">×</button></div>' +
      '<div class="reminder-list">' + rows + '</div>' +
      '<div class="reminder-foot"><button class="btn ghost mini" data-act="ics">导出临期 .ics</button>' +
        '<span>「稍后提醒」的项目 7 天内不再弹出</span></div>' +
      '</div></div>';
  }

  function headerHTML(){
    var tabs = [['overview', '概览'], ['skin', '护肤'], ['makeup', '彩妆'], ['data', '数据']];
    return '<header class="topbar"><div class="topbar-inner">' +
      '<div class="brandline">' +
        '<div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6v3l2.2 3.3A5 5 0 0 1 18 12v6a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3v-6a5 5 0 0 1 .8-2.7L9 6V3z"/><path d="M8 13h8"/></svg></div>' +
        '<div><h1>护肤品库存管理</h1><p>离线可用 · 本地自动保存</p></div>' +
      '</div>' +
      '<nav class="tabs">' + tabs.map(function(t){
        return '<button data-act="tab" data-tab="' + t[0] + '" class="' + (ui.tab === t[0] ? 'on' : '') + '">' + t[1] + '</button>';
      }).join('') + '</nav>' +
      '</div></header>';
  }

  function statHTML(active){
    var skin = active.filter(function(r){ return r.board === 'skin'; });
    var makeup = active.filter(function(r){ return r.board === 'makeup'; });
    var near = active.filter(function(r){ return recordStatus(r).key === 'near'; });
    var expired = active.filter(function(r){ return recordStatus(r).key === 'expired'; });
    var samples = active.filter(function(r){ return r.type === '小样' && !r.opened; });
    return '<div class="stat-grid">' +
      '<div class="stat"><span class="stat-label">总件数</span><strong>' + qsum(active) + '</strong><span class="stat-sub">不含已用完</span></div>' +
      '<div class="stat"><span class="stat-label">护肤</span><strong>' + qsum(skin) + '</strong><span class="stat-sub">' + skin.length + ' 条记录</span></div>' +
      '<div class="stat"><span class="stat-label">彩妆</span><strong>' + qsum(makeup) + '</strong><span class="stat-sub">' + makeup.length + ' 条记录</span></div>' +
      '<div class="stat"><span class="stat-label">未开封小样</span><strong>' + qsum(samples) + '</strong><span class="stat-sub">' + samples.length + ' 条记录</span></div>' +
      '<div class="stat warn"><span class="stat-label">30 天内临期</span><strong>' + near.length + '</strong><span class="stat-sub">共 ' + qsum(near) + ' 件</span></div>' +
      '<div class="stat bad"><span class="stat-label">已过期</span><strong>' + expired.length + '</strong><span class="stat-sub">共 ' + qsum(expired) + ' 件</span></div>' +
      '</div>';
  }

  function barsHTML(board){
    var active = state.records.filter(function(r){ return r.board === board && !r.finished; });
    var cats = state.categories[board];
    var counts = cats.map(function(c){ return { name: c.name, qty: qsum(active.filter(function(r){ return r.category === c.name; })) }; });
    var max = 1;
    counts.forEach(function(c){ if (c.qty > max) max = c.qty; });
    return counts.map(function(c){
      return '<div class="bar-row"><span class="bar-label" title="' + esc(c.name) + '">' + esc(c.name) + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + (c.qty / max * 100).toFixed(1) + '%"></div></div>' +
        '<span class="bar-num">' + c.qty + '</span></div>';
    }).join('');
  }

  function brandStats(){
    var map = {};
    state.records.filter(function(r){ return !r.finished; }).forEach(function(r){
      var key = r.brand.trim() || '未填写品牌';
      if (!map[key]) map[key] = { brand: key, qty: 0, cats: {}, boards: {} };
      map[key].qty += r.qty;
      map[key].cats[r.category] = (map[key].cats[r.category] || 0) + r.qty;
      map[key].boards[r.board] = true;
    });
    return Object.keys(map).map(function(k){ return map[k]; })
      .sort(function(a, b){ return (b.qty - a.qty) || cmpZh(a.brand, b.brand); });
  }

  function ovList(items, emptyText){
    if (!items.length) return '<p class="hint">' + emptyText + '</p>';
    var shown = items.slice(0, 8);
    return '<div class="ov-list">' + shown.map(function(r){
      var st = recordStatus(r);
      var due = dueInfo(r).due;
      var tail = st.days == null ? '' : (st.days < 0 ? '超期 ' + (-st.days) + ' 天' : '剩 ' + st.days + ' 天');
      return '<button class="ov-row" data-act="edit" data-id="' + esc(r.id) + '">' +
        '<span class="tag">' + BOARD_LABEL[r.board] + '</span>' +
        '<span class="oname">' + esc(r.brand) + ' · ' + esc(r.name) + '</span>' +
        '<span class="odate">' + esc(due) + (tail ? ' · ' + tail : '') + '</span></button>';
    }).join('') + (items.length > 8 ? '<p class="hint">还有 ' + (items.length - 8) + ' 项，可在对应板块筛选查看</p>' : '') + '</div>';
  }

  function overviewHTML(){
    var active = state.records.filter(function(r){ return !r.finished; });
    var near = active.filter(function(r){ return recordStatus(r).key === 'near'; }).sort(byDue);
    var expired = active.filter(function(r){ return recordStatus(r).key === 'expired'; }).sort(byDue);
    var brands = brandStats();

    return '<section class="panel">' +
      '<div class="panel-head"><div><h2>库存概览</h2><p>护肤与彩妆分开统计，品牌按在用数量排序</p></div>' +
        '<div class="head-actions"><button class="btn" data-act="photo" data-board="skin">拍照入库</button>' +
        '<button class="btn primary" data-act="add" data-board="skin">+ 添加记录</button></div></div>' +
      '<div style="margin-top:14px">' + statHTML(active) + '</div>' +
      '</section>' +
      '<section class="section"><div class="section-head"><h3>品类数量分布</h3><span class="hint">数字为件数（数量合计）</span></div>' +
        '<div class="two-col">' +
          '<div class="board-block"><h4>护肤<span>' + qsum(active.filter(function(r){ return r.board === 'skin'; })) + ' 件</span></h4>' + barsHTML('skin') + '</div>' +
          '<div class="board-block"><h4>彩妆<span>' + qsum(active.filter(function(r){ return r.board === 'makeup'; })) + ' 件</span></h4>' + barsHTML('makeup') + '</div>' +
        '</div></section>' +
      '<section class="section"><div class="section-head"><h3>品牌分布</h3><span class="hint">每个品牌下的品类件数</span></div>' +
        '<div>' + (brands.length ? brands.map(function(b){
          var cats = Object.keys(b.cats).sort(cmpZh).map(function(c){
            return '<span class="chip">' + esc(c) + ' ' + b.cats[c] + '</span>';
          }).join('');
          var boardTags = Object.keys(b.boards).map(function(x){ return BOARD_LABEL[x]; }).join(' / ');
          return '<div class="brand-row"><div class="brand-line"><b>' + esc(b.brand) + '</b><span class="bq">' + boardTags + ' · ' + b.qty + ' 件</span></div><div class="brand-cats">' + cats + '</div></div>';
        }).join('') : '<p class="hint">还没有品牌数据</p>') + '</div></section>' +
      '<section class="section"><div class="section-head"><h3>临期 / 过期清单</h3>' +
        '<button class="btn ghost mini" data-act="ics">导出临期 .ics</button></div>' +
        '<div class="two-col">' +
          '<div><h4 class="hint" style="margin-bottom:8px;color:var(--near);font-size:12.5px">30 天内临期（' + near.length + '）</h4>' + ovList(near, '暂无临期项目') + '</div>' +
          '<div><h4 class="hint" style="margin-bottom:8px;color:var(--danger);font-size:12.5px">已过期（' + expired.length + '）</h4>' + ovList(expired, '暂无过期项目') + '</div>' +
        '</div></section>';
  }

  function toolbarHTML(board){
    var f = ui.filters[board];
    var brands = {};
    state.records.filter(function(r){ return r.board === board; }).forEach(function(r){ if (r.brand) brands[r.brand] = 1; });
    var brandList = Object.keys(brands).sort(cmpZh);
    var catOpts = state.categories[board].map(function(c){
      return '<option value="' + esc(c.name) + '"' + (f.cat === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join('');

    return '<div class="toolbar">' +
      '<div class="search"><input id="search-' + board + '" data-f="q" data-board="' + board + '" value="' + esc(f.q) + '" placeholder="搜索品牌 / 产品 / 色号 / 备注" aria-label="搜索"></div>' +
      '<div class="selects">' +
        '<select data-f="brand" data-board="' + board + '" aria-label="品牌"><option value="">全部品牌</option>' + brandOpts + '</select>' +
        '<select data-f="cat" data-board="' + board + '" aria-label="品类"><option value="">全部品类</option>' + catOpts + '</select>' +
        '<select data-f="type" data-board="' + board + '" aria-label="类型"><option value="">正装/中样/小样</option>' +
          TYPE_LIST.map(function(t){ return '<option value="' + t + '"' + (f.type === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select>' +
        '<select data-f="status" data-board="' + board + '" aria-label="状态"><option value="">全部状态</option>' +
          ['safe', 'near', 'expired', 'finished'].map(function(k){
            return '<option value="' + k + '"' + (f.status === k ? ' selected' : '') + '>' + STATUS_META[k].label + '</option>';
          }).join('') + '</select>' +
        '<select data-f="sort" data-board="' + board + '" aria-label="排序"><option value="due"' + (f.sort === 'due' ? ' selected' : '') + '>按到期日</option>' +
          '<option value="brand"' + (f.sort === 'brand' ? ' selected' : '') + '>按品牌</option>' +

        '<button class="btn ghost mini" data-act="resetFilters" data-board="' + board + '">重置</button>' +

      '<div class="view-toggle"><span class="hint">分组：</span>' +

        '<button data-act="view" data-board="' + board + '" data-view="brand" class="' + (f.view === 'brand' ? 'on' : '') + '">按品牌</button>' +
      '</div>' +
      '</div>';
  }

  function coverId(r){
    var arr = r.photos || [];
    if (r.cover && arr.indexOf(r.cover) >= 0) return r.cover;
    return arr[0] || '';
  }
  function imgThumb(id){
    return id && imgCache.meta[id] ? imgCache.meta[id].thumb : '';
  }

  function itemHTML(r){
    var st = recordStatus(r);
    var info = dueInfo(r);
    var tone = st.key === 'near' ? 'tone-near' : st.key === 'expired' ? 'tone-expired' : '';
    var meta = [r.category, r.size ? r.size + r.unit : '', r.type, '数量 ' + r.qty].filter(Boolean).join(' · ');
    var extras = '';
    if (r.board === 'makeup' && r.shade) extras += '<span class="spec-chip">色号 ' + esc(r.shade) + '</span> ';
    if (r.board === 'makeup' && r.frequent) extras += '<span class="chip">常用</span>';
    var openLine = r.opened
      ? '开封 ' + esc(r.openDate || '未填') + ' · 开封后 ' + r.openMonths + ' 个月'
      : '未开封' + (r.expiryDate
          ? ' · 包装到期 ' + esc(r.expiryDate)
          : (r.prodDate ? ' · 生产 ' + esc(r.prodDate) + ' + ' + r.shelfMonths + ' 个月' : ''));
    var dueLine = info.due
      ? '到期 ' + esc(info.due) + '（' + info.basis + '）' + (st.days != null ? (st.days < 0 ? ' · 已超期 ' + (-st.days) + ' 天' : ' · 剩 ' + st.days + ' 天') : '')
      : '未设置到期日';
    var sub = [];
    if (r.location) sub.push('存放：' + esc(r.location));
    var actions = '<button class="btn mini" data-act="edit" data-id="' + esc(r.id) + '">编辑</button>' +
      (r.finished
        ? '<button class="btn mini ghost" data-act="restore" data-id="' + esc(r.id) + '">恢复</button>'
        : '<button class="btn mini ghost" data-act="finish" data-id="' + esc(r.id) + '">用完</button>') +
      '<button class="btn mini danger" data-act="del" data-id="' + esc(r.id) + '">删除</button>';

    var photos = r.photos || [];
    var thumb = imgThumb(coverId(r));
    var photo = thumb
      ? '<button type="button" class="item-photo" data-act="viewimg" data-id="' + esc(r.id) + '" aria-label="查看照片"><img src="' + thumb + '" alt="产品照片">' +
        (photos.length > 1 ? '<span class="pcount">' + photos.length + ' 张</span>' : '') + '</button>'
      : '';

    return '<article class="item ' + tone + '">' + photo +
      '<div class="item-main">' +
        '<div class="item-title"><span class="ibrand">' + esc(r.brand || '未填品牌') + '</span> ' + esc(r.name) + '</div>' +
        '<div class="item-meta">' + esc(meta) + '</div>' +
        (extras ? '<div class="item-meta">' + extras + '</div>' : '') +
        '<div class="item-date">' + dueLine + '</div>' +
        '<div class="item-sub">' + openLine + (sub.length ? ' · ' + sub.join(' · ') : '') + '</div>' +
        (r.note ? '<div class="item-note">' + esc(r.note) + '</div>' : '') +
      '</div>' +
      '<div class="item-side"><span class="badge ' + st.key + '">' + st.label + (st.key === 'near' && st.days != null ? ' · ' + st.days + '天' : '') + '</span>' +
        '<div class="item-actions">' + actions + '</div></div>' +
      '</article>';
  }

  function boardListHTML(board){
    var list = filteredRecords(board);
    if (!list.length) return '<div class="empty">没有符合条件的记录，试试调整筛选或添加新记录。</div>';
    var f = ui.filters[board];
    var keys = groupKeys(board, list);
    return keys.map(function(k){
      var items = sortRecords(list.filter(function(r){
        return f.view === 'brand' ? (r.brand.trim() || '未填写品牌') === k : r.category === k;
      }), f.sort);
      var ckey = f.view + '|' + k;
      var collapsed = ui.collapsed[board].has(ckey);
      return '<section class="group">' +
        '<button class="group-head" data-act="toggle" data-board="' + board + '" data-key="' + esc(ckey) + '">' +
          '<span class="chev ' + (collapsed ? '' : 'open') + '"></span>' +
          '<span class="group-name">' + esc(k) + '</span>' +
          '<span class="group-count">' + qsum(items) + ' 件 · ' + items.length + ' 条</span>' +
        '</button>' +
        (collapsed ? '' : '<div class="cards">' + items.map(itemHTML).join('') + '</div>') +
      '</section>';
    }).join('');
  }

    return '<section class="panel">' +
      '<div class="panel-head"><div><h2>' + BOARD_LABEL[board] + '清单</h2>' +

  function dataHTML(){

      '<div class="panel-head"><div><h2>数据管理</h2><p>数据仅保存在本机浏览器 localStorage，不会上传到任何服务器。</p></div></div>' +

  function toggleFormBlocks(form){
    var opened = document.getElementById('fOpened').checked;
    document.getElementById('openedBlock').style.display = opened ? '' : 'none';

  function formDue(form){
    var opened = document.getElementById('fOpened').checked;
    var openDate = document.getElementById('fOpenDate').value;
    var openMonths = Number(document.getElementById('fOpenMonths').value);
    var expiry = document.getElementById('fExpiry').value;
    var prod = document.getElementById('fProd').value;
    var shelf = Number(document.getElementById('fShelf').value);
    var due = null, basis = '';
    if (opened && openDate && openMonths >= 1){
      due = addMonths(openDate, openMonths); basis = '开封后';
    } else if (!opened && expiry){
      due = expiry; basis = '未开封';
    } else if (!opened && prod && shelf >= 1){
      due = addMonths(prod, shelf); basis = '生产+保质期';
    }
    return { due: due, basis: basis };
  }

  function updatePreview(form){
    var box = document.getElementById('duePreview');
    if (!box) return;
    var info = formDue(form);
    if (!info.due){ box.innerHTML = '预计到期：<b>未设置</b>，保存后将显示为「安全」但不会提醒。'; return; }
    var d = daysFromToday(info.due);
    var tail = d < 0 ? '已超期 ' + (-d) + ' 天' : d <= 30 ? '剩 ' + d + ' 天（临近）' : '剩 ' + d + ' 天';
    box.innerHTML = '预计到期：<b>' + esc(info.due) + '</b>（' + info.basis + '）· ' + tail;
  }

      unit: document.getElementById('fUnit').value,
      type: typeEl ? typeEl.value : '正装',
      qty: Number(document.getElementById('fQty').value),
      opened: document.getElementById('fOpened').checked,
      openDate: document.getElementById('fOpenDate').value,
      openMonths: Number(document.getElementById('fOpenMonths').value),

  function validateRecord(d){
    var errs = [];
    if (!d.brand) errs.push('请填写品牌');
    if (!d.name) errs.push('请填写产品名称');
    if (!isFinite(d.qty) || Math.floor(d.qty) !== d.qty || d.qty < 1) errs.push('数量必须是不小于 1 的整数');
    if (d.size !== '' && (!isFinite(d.size) || d.size <= 0)) errs.push('规格需为正数');
    if (d.opened){
      if (!d.openDate) errs.push('已开封时请填写开封日期');
      else if (d.openDate > todayISO()) errs.push('开封日期不能晚于今天');
      if (!(d.openMonths >= 1 && d.openMonths <= 120)) errs.push('开封后期限请填写 1 - 120 个月');
    } else {
      if (d.expiryDate && d.prodDate && d.expiryDate < d.prodDate) errs.push('未开封到期日不能早于生产日期');
      if (d.prodDate && !(d.shelfMonths >= 1 && d.shelfMonths <= 120)) errs.push('填写生产日期时，请同时填写 1 - 120 个月的保质期');
    }
    return errs;
  }

  function markInvalid(form, d, errs){
    ['fBrand', 'fName', 'fQty', 'fSize', 'fOpenDate', 'fOpenMonths', 'fExpiry', 'fProd', 'fShelf'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.classList.remove('invalid');
    });
    var map = {
      '请填写品牌': ['fBrand'],
      '请填写产品名称': ['fName'],
      '数量必须是不小于 1 的整数': ['fQty'],
      '规格需为正数': ['fSize']
    };
    errs.forEach(function(msg){
      (map[msg] || ['fOpenDate', 'fOpenMonths', 'fExpiry', 'fProd', 'fShelf']).forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.classList.add('invalid');
      });
    });
    var box = document.getElementById('formErr');
    box.classList.add('show');
    box.innerHTML = '请检查以下内容：<ul>' + errs.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
  }

  function submitForm(form, existing){
    var d = readForm(form);
    var errs = validateRecord(d);
    if (errs.length){
      markInvalid(form, d, errs);
      var box = document.getElementById('formErr');
      if (box) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return;
    }
    var draft = photoDraft || { items: [], cover: '' };
    var ids = draft.items.map(function(it){ return it.id; });
    var cover = ids.indexOf(draft.cover) >= 0 ? draft.cover : (ids[0] || '');
    var newImgs = draft.items.filter(function(it){ return it.added && it.full; });
    var oldIds = existing ? (existing.photos || []).slice() : [];
    var rec = {
      id: existing ? existing.id : uid(),
      board: d.board,
      brand: d.brand,
      name: d.name,
      category: d.category,
      size: d.size,
      unit: d.unit,
      type: d.type,
      qty: Math.round(d.qty),
      opened: d.opened,
      openDate: d.opened ? d.openDate : '',
      openMonths: d.opened ? Math.round(d.openMonths) : catMonths(d.board, d.category),
      expiryDate: d.opened ? '' : d.expiryDate,
      prodDate: d.opened ? '' : d.prodDate,
      shelfMonths: d.opened ? '' : d.shelfMonths,
      location: d.location,
      note: d.note,
      shade: d.board === 'makeup' ? d.shade : '',
      frequent: d.board === 'makeup' ? d.frequent : false,
      finished: existing ? existing.finished : false,
      snoozeUntil: '',
      sample: existing ? existing.sample : false,
      photos: ids,
      cover: cover,
      imgId: cover
    };
    var idx = state.records.findIndex(function(r){ return existing && r.id === existing.id; });
    if (idx >= 0) state.records[idx] = rec;
    else state.records.push(rec);
    persist();
    photoDraft = null;
    closeModal();
    toast(existing ? '已保存修改' : '已添加记录');

    // 已从记录中移除的照片，保存后删除以释放空间
    oldIds.forEach(function(id){
      if (ids.indexOf(id) < 0){
        imgDelete(id).catch(function(){});
        delete imgCache.meta[id];
      }
    });
    renderApp(true);
    if (!newImgs.length) return;
    var failed = [];
    var chain = Promise.resolve();
    newImgs.forEach(function(im){
      chain = chain.then(function(){
        return imgPut(im.id, im.thumb, im.full).then(function(){
          imgCache.meta[im.id] = {
            id: im.id, thumb: im.thumb,
            bytes: im.thumb.length + im.full.length, createdAt: Date.now()
          };
        }).catch(function(e){
          console.warn('照片保存失败', e);
          failed.push(im.id);
        });
      });
    });
    chain.then(function(){
      if (failed.length){
        var target = findRecord(rec.id);
        if (target){
          target.photos = (target.photos || []).filter(function(id){ return failed.indexOf(id) < 0; });
          if (target.photos.indexOf(target.cover) < 0) target.cover = target.photos[0] || '';
          target.imgId = target.cover;
          persist();
        }
        toast('部分照片保存失败（浏览器存储可能已满），记录本身已保存');
      }
      renderApp(true);
    });
  }

    var cat = state.categories[board][index];

    document.getElementById('catForm').addEventListener('submit', function(e){
      e.preventDefault();
      var newName = document.getElementById('cName').value.trim();
      var months = Number(document.getElementById('cMonths').value);
      var errs = [];
      if (!newName) errs.push('品类名称不能为空');
      var dup = state.categories[board].some(function(c, i){ return i !== index && c.name === newName; });
      if (dup) errs.push('已存在同名品类');
      if (!(months >= 1 && months <= 120)) errs.push('默认期限请填写 1 - 120 个月');
      if (errs.length){
        var box = document.getElementById('catErr');
        box.classList.add('show');
        box.innerHTML = '请检查以下内容：<ul>' + errs.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
        return;
      }
      var oldName = cat.name;
      state.categories[board][index] = { name: newName, months: Math.round(months) };
      if (newName !== oldName){
        state.records.forEach(function(r){ if (r.board === board && r.category === oldName) r.category = newName; });
        if (ui.filters[board].cat === oldName) ui.filters[board].cat = '';
      }
      persist();
      closeModal();
      toast('品类已更新');
      renderApp(true);
    });
    var nameInput = document.getElementById('cName');
    if (nameInput) setTimeout(function(){ nameInput.focus(); }, 100);
  }

  function download(content, filename, type){
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  function exportJSON(){

    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try { parsed = JSON.parse(reader.result); }
      catch (e){ toast('文件不是有效的 JSON'); return; }
      var arr = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.records) ? parsed.records : null);
      if (!arr){ toast('JSON 结构中找不到记录数组'); return; }
      if (!arr.length){ toast('该文件没有记录，未做改动'); return; }
      var imgs = (parsed && Array.isArray(parsed.images)) ? parsed.images : [];
      confirmDialog('导入将用文件中的 ' + arr.length + ' 条记录替换当前全部数据' +
        (imgs.length ? '，并恢复 ' + imgs.length + ' 张照片' : '') + '，确定继续？', function(){
        var normalized = normalizeState({
          records: arr,
          categories: (parsed && parsed.categories) || state.categories,
          settings: state.settings
        });
        var commit = function(){
          state = normalized;
          state.records.forEach(function(r){
            r.photos = (r.photos || []).filter(function(id){ return imgCache.meta[id]; });
            if (r.photos.indexOf(r.cover) < 0) r.cover = r.photos[0] || '';
            r.imgId = r.cover;

          persist();
          toast('已导入 ' + state.records.length + ' 条记录' + (imgs.length ? '（含 ' + imgs.length + ' 张照片）' : ''));
          renderApp(false);
        };
        if (!imgs.length){ commit(); return; }
        var chain = Promise.resolve();
        imgs.forEach(function(im){
          if (!im || !im.id || !im.full) return;
          chain = chain.then(function(){
            return imgPut(im.id, im.thumb || '', im.full).then(function(){
              imgCache.meta[im.id] = {
                id: im.id, thumb: im.thumb || '',
                bytes: (im.thumb || '').length + im.full.length,
                createdAt: im.createdAt || Date.now()

            });
          });
        });
        chain.then(commit).catch(function(e){
          console.warn('图片导入失败', e);
          toast('部分照片导入失败，记录仍会导入');
          commit();
        });
      }, '确认导入');

  /* ---------- 9.1 IndexedDB 图片库（localStorage 存不下图片） ---------- */
  var PHOTO_DB = 'skincarePhotosV1';
  var idbPromise = null;

  function idbOpen(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function(resolve, reject){
      if (!window.indexedDB){ reject(new Error('浏览器不支持 IndexedDB')); return; }
      var req = indexedDB.open(PHOTO_DB, 1);
      req.onupgradeneeded = function(){
        var db = req.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('full')) db.createObjectStore('full', { keyPath: 'id' });
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error || new Error('图片库打开失败')); };
    });
    return idbPromise;
  }

  function idbRun(storeName, mode, fn){
    return idbOpen().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, mode);
        var store = tx.objectStore(storeName);
        var result;
        var req = fn(store);
        if (req) req.onsuccess = function(){ result = req.result; };
        tx.oncomplete = function(){ resolve(result); };
        tx.onerror = function(){ reject(tx.error || new Error('图片库读写失败')); };
        tx.onabort = function(){ reject(tx.error || new Error('图片库操作中止')); };
      });
    });
  }

  function imgPut(id, thumb, full){
    var bytes = (thumb || '').length + (full || '').length;
    return idbRun('meta', 'readwrite', function(s){
      return s.put({ id: id, thumb: thumb, bytes: bytes, createdAt: Date.now() });
    }).then(function(){
      return idbRun('full', 'readwrite', function(s){ return s.put({ id: id, data: full }); });
    }).then(function(){ return { id: id, thumb: thumb, bytes: bytes }; });
  }
  function imgGetFull(id){
    return idbRun('full', 'readonly', function(s){ return s.get(id); }).then(function(v){ return v && v.data ? v.data : ''; });
  }
  function imgDelete(id){
    return idbRun('meta', 'readwrite', function(s){ return s.delete(id); }).then(function(){
      return idbRun('full', 'readwrite', function(s){ return s.delete(id); });
    });
  }
  function imgAllMeta(){ return idbRun('meta', 'readonly', function(s){ return s.getAll(); }).then(function(v){ return v || []; }); }
  function imgAllFull(){ return idbRun('full', 'readonly', function(s){ return s.getAll(); }).then(function(v){ return v || []; }); }
  function imgClearAll(){
    return idbRun('meta', 'readwrite', function(s){ return s.clear(); }).then(function(){
      return idbRun('full', 'readwrite', function(s){ return s.clear(); });
    });
  }

  function loadImgCache(){
    return imgAllMeta().then(function(list){
      var map = {};
      list.forEach(function(m){ if (m && m.id) map[m.id] = m; });

      imgCache.ready = true;
      imgCache.error = null;

  /* ---------- 9.2 图片解码与压缩 ---------- */
  function fileToImageEl(file){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){ URL.revokeObjectURL(url); resolve(img); };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('无法解码这张图片')); };
      img.src = url;
    });
  }
  function decodeImage(file){
    if (window.createImageBitmap){
      return createImageBitmap(file, { imageOrientation: 'from-image' })
        .catch(function(){ return createImageBitmap(file); })
        .catch(function(){ return fileToImageEl(file); });
    }
    return fileToImageEl(file);
  }
  function drawToDataURL(img, maxEdge, quality){
    var w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
    if (!w || !h) throw new Error('图片尺寸异常');
    var scale = Math.min(1, maxEdge / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    var canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(img, 0, 0, cw, ch);
    return canvas.toDataURL('image/jpeg', quality);
  }
  function compressPhoto(img){
    return {
      full: drawToDataURL(img, 1200, 0.82),
      thumb: drawToDataURL(img, 300, 0.68)
    };
  }

  function normText(s){
    return String(s || '').toUpperCase()
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(ch){ return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0); })
      .replace(/[‐‑–—]/g, '-')
      .replace(/\s+/g, '')
      .replace(/[·・.,，。:：;；'"“”‘’()（）\[\]【】<>《》!！?？]/g, '');
  }
  function escapeReg(s){
    return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function brandCandidates(text){
    var raw = String(text || '').toUpperCase();
    var glued = normText(text);
    var found = {};
    BRANDS.forEach(function(b){
      var best = 0, hit = '';
      b.aliases.forEach(function(a){
        var na = normText(a);
        if (!na) return;
        var latin = /^[A-Z0-9]/.test(na);
        var matched = false;
        if (latin && na.length <= 3){
          matched = new RegExp('(^|[^A-Z0-9])' + escapeReg(na) + '([^A-Z0-9]|$)').test(raw);
        } else {
          matched = glued.indexOf(na) >= 0;
        }
        if (!matched) return;
        var base = 50 + Math.min(24, na.length * 6);
        if (!latin) base += 4;
        if (na.length >= 6) base += 4;
        if (glued.indexOf(na) >= 0 && glued.indexOf(na) < 40) base += 2;
        var score = Math.min(95, base);
        if (score > best){ best = score; hit = a; }
      });
      if (best && !found[b.name]) found[b.name] = { name: b.name, score: best, hit: hit };
    });
    return Object.keys(found).map(function(k){ return found[k]; })
      .sort(function(a, b){ return b.score - a.score; }).slice(0, 3);
  }

  function categoryCandidates(text){
    var res = { skin: [], makeup: [] };
    var flat = normText(text);
    ['skin', 'makeup'].forEach(function(board){
      Object.keys(CAT_WORDS[board]).forEach(function(name){
        var words = CAT_WORDS[board][name];
        if (!words.length) return;
        var hits = [], score = 45;
        words.forEach(function(kw){
          var nk = normText(kw);
          if (nk && flat.indexOf(nk) >= 0){ hits.push(kw); score += 10 + Math.min(10, kw.length * 2); }
        });
        if (hits.length){
          res[board].push({ name: name, score: Math.min(95, score), hits: hits.slice(0, 3) });
        }
      });
      res[board].sort(function(a, b){ return b.score - a.score; });
    });
    return res;
  }
